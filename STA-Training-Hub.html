function App() {
  const data = window.TRAINING_DATA;
  const [activeAud, setActiveAud] = useState(() => {
    const saved = localStorage.getItem('sta_training_aud');
    return saved && data.audiences.find(a => a.id === saved) ? saved : 'start';
  });
  const [search, setSearch] = useState('');
  const [favorites, setFavorites] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('sta_training_favs') || '[]');
    } catch { return []; }
  });
  const [viewerDocId, setViewerDocId] = useState(null);

  useEffect(() => { localStorage.setItem('sta_training_aud', activeAud); }, [activeAud]);
  useEffect(() => { localStorage.setItem('sta_training_favs', JSON.stringify(favorites)); }, [favorites]);

  const toggleFav = useCallback((docId) => {
    setFavorites(prev => prev.includes(docId) ? prev.filter(id => id !== docId) : [...prev, docId]);
  }, []);

  const openDoc = useCallback((docId) => {
    const doc = data.docs[docId];
    if (!doc) return;
    // All types route through the viewer:
    //   html  -> iframe
    //   md    -> fetch + marked.js parse + render
    //   docx  -> fetch + mammoth.js convert + render
    //   pptx  -> show fallback message with "open in new tab" button
    setViewerDocId(docId);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [data.docs]);

  const closeViewer = useCallback(() => setViewerDocId(null), []);

  // Tab switch also closes any open doc so users don't have to click Back first.
  const selectAud = useCallback((audId) => {
    setActiveAud(audId);
    setViewerDocId(null);
  }, []);

  // Search across all docs
  const searchResults = useMemo(() => {
    if (!search.trim()) return null;
    const q = search.trim().toLowerCase();
    const matches = Object.entries(data.docs)
      .filter(([id, doc]) =>
        doc.title.toLowerCase().includes(q) ||
        doc.desc.toLowerCase().includes(q) ||
        (doc.tags || []).some(t => t.toLowerCase().includes(q))
      )
      .map(([id]) => id);
    return matches;
  }, [search, data.docs]);

  const aud = data.audiences.find(a => a.id === activeAud);
  const hasFavorites = favorites.length > 0;

  return (
    <div className="app">
      <Header search={search} setSearch={setSearch} />
      <TabBar
        audiences={data.audiences}
        activeAud={activeAud}
        setActiveAud={selectAud}
        hasFavorites={hasFavorites}
        favoritesCount={favorites.length}
      />
      {viewerDocId ? (
        <Viewer
          doc={data.docs[viewerDocId]}
          onClose={closeViewer}
        />
      ) : (
        <div className="content">
          {search.trim() ? (
            <SearchResults
              results={searchResults}
              docs={data.docs}
              favorites={favorites}
              toggleFav={toggleFav}
              openDoc={openDoc}
              query={search}
            />
          ) : activeAud === 'favorites' ? (
            <FavoritesView
              favorites={favorites}
              docs={data.docs}
              toggleFav={toggleFav}
              openDoc={openDoc}
            />
          ) : (
            <AudienceView
              audience={aud}
              docs={data.docs}
              favorites={favorites}
              toggleFav={toggleFav}
              openDoc={openDoc}
            />
          )}
        </div>
      )}
      <Footer />
    </div>
  );
}

function Header({ search, setSearch }) {
  return (
    <header className="app-header">
      <div className="hdr-brand">
        <div className="hdr-title">STA AI Training Hub</div>
        <div className="hdr-sub">School Technology Associates &middot; Internal</div>
      </div>
      <div className="search-wrap">
        <span className="search-icon">🔍</span>

}

function DocCard({ docId, doc, isFav, toggleFav, openDoc }) {
  const handleClick = (e) => {
    // Don't open doc when clicking the favorite button
    if (e.target.closest('.card-fav')) return;
    openDoc(docId);
  };
  const handleFavClick = (e) => {
    e.stopPropagation();
    toggleFav(docId);
  };
  const priorityClass = `card-${doc.priority || 'optional'}`;
  return (
    <div className={`card ${priorityClass}`} onClick={handleClick} title={`Open ${doc.title}`}>
      <div className="card-head">
        <div className="card-icon">{doc.icon || '\u{1F4C4}'}</div>
        <div className="card-titleblock">
          <div className="card-title">{doc.title}</div>
          <div className="card-filename">{doc.file}</div>
        </div>
        <button
          className={`card-fav ${isFav ? 'active' : ''}`}
          onClick={handleFavClick}
          title={isFav ? 'Remove from saved' : 'Save for quick access'}
          aria-label={isFav ? 'Remove from saved' : 'Save for quick access'}
        >
          {isFav ? '\u{2605}' : '\u{2606}'}
        </button>
      </div>
      <div className="card-desc">{doc.desc}</div>
      <div className="card-meta">
        {doc.priority && (
          <span className={`pill pill-${doc.priority}`}>{doc.priority}</span>
        )}
        {doc.type && (
          <span className={`pill pill-${doc.type}`}>{doc.type.toUpperCase()}</span>
        )}
        {(doc.tags || []).slice(0, 2).map(t => (
          <span key={t} className="pill pill-optional">{t}</span>
        ))}
      </div>
    </div>
  );
}

function Viewer({ doc, onClose }) {
  const [renderedHtml, setRenderedHtml] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!doc) return;
    setRenderedHtml(null);
    setError(null);
    // HTML files render in iframe directly - no fetch needed
    if (doc.type === 'html') return;
    // PPTX: no inline renderer, show fallback message
    if (doc.type === 'pptx') return;
    // MD and DOCX get fetched and converted client-side
    setLoading(true);
    if (doc.type === 'md') {
      fetch(doc.file)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(text => {
          if (typeof window.marked === 'undefined') throw new Error('marked.js not loaded');
          const html = window.marked.parse(text, { breaks: true, gfm: true });
          setRenderedHtml(html);
          setLoading(false);
        })
        .catch(e => { setError(e.message); setLoading(false); });
    } else if (doc.type === 'docx') {
      fetch(doc.file)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then(buffer => {
          if (typeof window.mammoth === 'undefined') throw new Error('mammoth.js not loaded');
          return window.mammoth.convertToHtml({ arrayBuffer: buffer });
        })
        .then(result => {
          setRenderedHtml(result.value || '<p><em>Document is empty.</em></p>');
          setLoading(false);
        })
        .catch(e => { setError(e.message); setLoading(false); });
    }
  }, [doc]);

  if (!doc) return null;

  const renderBody = () => {
    if (doc.type === 'html') {
      return (
        <iframe
          className="viewer-frame"
          src={doc.file}
          title={doc.title}
          sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
        />
      );
    }
    if (doc.type === 'pptx') {
      return (
        <div className="viewer-rendered">
          <div className="viewer-rendered-inner">
            <h1>{doc.title}</h1>
            <p style={{ color: '#666', fontStyle: 'italic' }}>
              PowerPoint presentations can't be rendered inline in the browser. Click the button below to open it in a new tab — your computer will use the PowerPoint app or web viewer to display it.
            </p>
            <p style={{ marginTop: 24 }}>
              <button
                onClick={() => window.open(doc.file, '_blank', 'noopener,noreferrer')}
                style={{ background: 'var(--blue)', color: '#fff', border: 'none', borderRadius: 6, padding: '10px 18px', fontSize: '10.5pt', fontWeight: 700, cursor: 'pointer' }}
              >
                Open {doc.title} ↗
              </button>
            </p>
          </div>
        </div>
      );
    }
    if (loading) {
      return (
        <div className="viewer-rendered">
          <div className="viewer-loading">
            <div className="viewer-loading-spinner"></div>
            <div>Loading {doc.type === 'docx' ? 'Word document' : 'document'}...</div>
          </div>
        </div>
      );
    }
    if (error) {
      return (
        <div className="viewer-rendered">
          <div className="viewer-error">
            <strong>Could not load document</strong>
            {error}
            <p style={{ marginTop: 12 }}>
              <button
                onClick={() => window.open(doc.file, '_blank', 'noopener,noreferrer')}
                style={{ background: 'var(--blue)', color: '#fff', border: 'none', borderRadius: 4, padding: '6px 14px', fontSize: '9pt', cursor: 'pointer' }}
              >
                Try opening in a new tab instead ↗
              </button>
            </p>
          </div>
        </div>
      );
    }
    if (renderedHtml !== null) {
      return (
        <div className="viewer-rendered">
          <div className="viewer-rendered-inner" dangerouslySetInnerHTML={{ __html: renderedHtml }} />
        </div>
      );
    }
    return null;
  };

  return (
    <div className="viewer">
      <div className="viewer-bar">
        <button className="viewer-back" onClick={onClose} title="Back to all docs">
          ← Back
        </button>
        <div className="viewer-title">{doc.title}</div>
        <button
          className="viewer-open-new"
          onClick={() => window.open(doc.file, '_blank', 'noopener,noreferrer')}
          title="Open in a new tab"
        >
          Open in new tab ↗
        </button>
      </div>
      {renderBody()}
    </div>
  );
}
