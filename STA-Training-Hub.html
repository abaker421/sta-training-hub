  .noscript-banner { background: #fdf0ef; color: #c0392b; border-bottom: 2px solid #f5b8aa; padding: 16px 24px; text-align: center; font-weight: 700; font-size: 10.5pt; }

  /* HEADER */
  .app-header { display: flex; align-items: center; gap: 18px; background: var(--dark); color: #fff; padding: 0 28px; height: 64px; flex-shrink: 0; border-bottom: 3px solid var(--blue); }
  .hdr-logo { height: 40px; width: auto; display: block; flex-shrink: 0; }
  .hdr-brand { display: flex; flex-direction: column; flex-shrink: 0; }
  .ftr-mark { height: 22px; width: auto; vertical-align: middle; margin-right: 8px; }
  .hdr-title { font-size: 14pt; font-weight: 700; color: #e8eaf0; letter-spacing: 0.3px; }
  .hdr-sub { font-size: 8.5pt; color: rgba(255,255,255,0.55); margin-top: 1px; }
  .hdr-quickref { margin-left: auto; flex-shrink: 0; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25); color: #fff; font-family: inherit; font-size: 9pt; font-weight: 600; padding: 7px 14px; border-radius: 20px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  .hdr-quickref:hover { background: rgba(107,192,75,0.25); border-color: rgba(107,192,75,0.7); }
  .hdr-themetoggle { flex-shrink: 0; width: 34px; height: 34px; padding: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
  .hdr-themetoggle:hover { background: rgba(107,192,75,0.25); border-color: rgba(107,192,75,0.7); }
  .hdr-themetoggle svg { width: 17px; height: 17px; display: block; }
  .search-wrap { max-width: 320px; margin-left: 12px; position: relative; flex-shrink: 0; }
  .search-input { width: 100%; padding: 7px 14px 7px 34px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; font-family: inherit; font-size: 9pt; outline: none; transition: border-color .15s, background .15s; }
  .search-input::placeholder { color: rgba(255,255,255,0.45); }
  .search-input:focus { border-color: rgba(107,192,75,0.7); background: rgba(255,255,255,0.15); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 11pt; pointer-events: none; }

  /* AUDIENCE TABS */
  .tab-bar { display: flex; align-items: stretch; background: var(--blue); border-bottom: 3px solid var(--blue-dark); overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 11px 22px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 9.5pt; font-weight: 600; color: rgba(255,255,255,0.78); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -3px; transition: color .15s, border-color .15s, background .15s; display: flex; align-items: center; gap: 8px; }
  .tab:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .tab-active { color: #fff; border-bottom-color: var(--green); background: rgba(255,255,255,0.1); }
  .tab-saved { color: #f5d76e !important; }
  .tab-saved.tab-active { border-bottom-color: #f5d76e !important; }
  .tab-icon { font-size: 12pt; line-height: 1; }
  .tab-badge { display: inline-flex; align-items: center; justify-content: center; background: #f0b429; color: var(--dark); border-radius: 10px; font-size: 7pt; font-weight: 700; min-width: 18px; height: 16px; padding: 0 4px; margin-left: 4px; }

  /* CONTENT */
  .main-host { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .content { max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 32px 60px; }

  /* AUDIENCE HEADER */
  .aud-header { margin-bottom: 28px; }
  .aud-title { font-size: 22pt; font-weight: 700; color: var(--dark); margin-bottom: 6px; line-height: 1.15; }
  .aud-sub { font-size: 10pt; color: var(--gray); line-height: 1.55; max-width: 720px; }
  .search-info { font-size: 9pt; color: var(--gray); font-style: italic; margin-top: 8px; }

  /* PROGRESS (Start Here tab only) */
  .progress { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 28px; max-width: 520px; }
  .progress-label { font-size: 9.5pt; color: #555; margin-bottom: 8px; }
  .progress-label strong { color: var(--dark); font-size: 11pt; }
  .progress-track { height: 8px; background: #eef1f4; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 6px; transition: width .25s ease; }

  /* SCREENSHOTS PANEL (AI Admin only) */
  .screenshots-panel { margin-bottom: 28px; }
  .screenshots-panel ul { margin: 10px 0 0 20px; }
  .screenshots-panel li { font-size: 9pt; color: #444; line-height: 1.6; margin-bottom: 3px; }

  /* SECTION */
  .section { margin-bottom: 36px; }
  .section-title { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: var(--gray); padding-bottom: 8px; border-bottom: 2px solid var(--border); margin-bottom: 16px; display: flex; align-items: baseline; gap: 10px; }
  .section-count { font-size: 8pt; font-weight: 400; color: #aaa; background: #f0f0f0; border-radius: 10px; padding: 1px 8px; }

  /* CARD GRID */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  .card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; transition: border-color .12s, box-shadow .12s, transform .12s; cursor: pointer; position: relative; min-height: 152px; }
  .card:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(0,96,152,0.1); transform: translateY(-1px); }
  .card-required { border-top: 3px solid var(--blue); }
  .card-recommended { border-top: 3px solid var(--green); }
  .card-optional { border-top: 3px solid var(--gray); }
  .card-admin { border-top: 3px solid var(--orange); }
  .card-wip { border-top: 3px solid #6c3dbf; }
  .card-skill { border-top: 3px solid #0d7d8c; }
  .card-required-unread { }

  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-titleblock { flex: 1; min-width: 0; }
  .card-title { font-size: 11pt; font-weight: 700; color: var(--dark); line-height: 1.3; }
  .card-fav { background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 3px; font-size: 14px; line-height: 1; color: #ccc; transition: color .12s, background .12s; flex-shrink: 0; }
  .card-fav:hover { color: #f0b429; background: rgba(240,180,41,0.1); }
  .card-fav.active { color: #f0b429; }

  .card-desc { font-size: 9pt; color: #555; line-height: 1.55; flex: 1; }

  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
  .pill { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill-required { background: #e8f2f8; color: var(--blue); border: 1px solid #c0d8ea; }
  .pill-recommended { background: #edf7e6; color: var(--green-dark); border: 1px solid #b8e0a0; }
  .pill-optional { background: var(--light); color: var(--gray); border: 1px solid var(--border); }
  .pill-live { background: #edf7e6; color: var(--green-dark); border: 1px solid #b8e0a0; }
  .pill-coming { background: #f0eafd; color: #6c3dbf; border: 1px solid #d0b8f0; }
  .pill-wip { background: #f0eafd; color: #6c3dbf; border: 1px solid #d0b8f0; }
  .pill-skill { background: #e0f3f5; color: #0a6470; border: 1px solid #b3dfe5; }
  .pill-admin { background: #fef4e0; color: #a06500; border: 1px solid #f5cf80; }
  .pill-html { background: #e8f2f8; color: var(--blue); border: 1px solid #c0d8ea; }
  .pill-docx { background: #fef4e0; color: #a06500; border: 1px solid #f5cf80; }
  .pill-md { background: #fef4e0; color: #a06500; border: 1px solid #f5cf80; }
  .pill-pptx { background: #fdf0ef; color: var(--red); border: 1px solid #f5b8aa; }

  /* FRESHNESS CHIPS */
  .chip { font-size: 7.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .chip-new { background: #edf7e6; color: var(--green-dark); border: 1px solid #b8e0a0; }
  .chip-updated { background: #fff3da; color: #a06500; border: 1px solid #f5cf80; }

  /* READ TRACKING */
  .req-unread { font-size: 7.5pt; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.4px; }
  .card-read { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--gray); font-family: inherit; font-size: 8pt; font-weight: 600; padding: 3px 9px; border-radius: 12px; cursor: pointer; transition: color .12s, border-color .12s, background .12s; white-space: nowrap; }
  .card-read:hover { border-color: var(--green); color: var(--green-dark); }
  .card-read.is-read { background: #edf7e6; color: var(--green-dark); border-color: #b8e0a0; }

  /* CALLOUT */
  .callout { background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--blue); border-radius: 0 8px 8px 0; padding: 14px 18px; margin-bottom: 24px; font-size: 9.5pt; color: #444; line-height: 1.6; }
  .callout.green { border-left-color: var(--green); }
  .callout.orange { border-left-color: var(--orange); }
  .callout strong { color: var(--dark); }

  /* EMPTY STATE */
  .empty { padding: 80px 40px; text-align: center; }
  .empty-icon { font-size: 44px; opacity: 0.35; margin-bottom: 16px; }
  .empty-title { font-size: 12pt; font-weight: 700; color: #888; margin-bottom: 8px; }
  .empty-sub { font-size: 9.5pt; color: #bbb; line-height: 1.5; max-width: 420px; margin: 0 auto; }

  /* FOOTER */
  .app-footer { background: var(--dark); color: rgba(255,255,255,0.5); text-align: center; padding: 18px 28px; font-size: 9pt; flex-shrink: 0; }
  .app-footer strong { color: rgba(255,255,255,0.85); }
  .app-footer a { color: rgba(107,192,75,0.85); text-decoration: none; }
  .app-footer a:hover { text-decoration: underline; }

  /* DOC VIEWER (in-app iframe) */
  .viewer { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--white); }
  .viewer-bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .viewer-back { background: var(--light); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 9.5pt; font-weight: 600; color: var(--blue); cursor: pointer; transition: background .12s, border-color .12s; display: flex; align-items: center; gap: 6px; font-family: inherit; }
  .viewer-back:hover { background: #e8f2f8; border-color: var(--blue); }
  .viewer-title { font-size: 11pt; font-weight: 700; color: var(--dark); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-readtoggle { background: none; border: 1px solid var(--border); color: var(--gray); font-family: inherit; font-size: 9pt; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: color .12s, border-color .12s, background .12s; white-space: nowrap; }
  .viewer-readtoggle:hover { border-color: var(--green); color: var(--green-dark); }
  .viewer-readtoggle[aria-pressed="true"] { background: #edf7e6; color: var(--green-dark); border-color: #b8e0a0; }
  .viewer-open-new { background: none; border: none; color: var(--blue); font-size: 9pt; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: background .12s; font-family: inherit; }
  .viewer-open-new:hover { background: var(--light); text-decoration: underline; }
  .viewer-download { background: var(--blue); color: #fff; border: none; border-radius: 4px; padding: 6px 10px; font-size: 9pt; font-weight: 700; text-decoration: none; cursor: pointer; margin-right: 8px; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; transition: background .12s; }
  .viewer-download:hover { background: var(--blue-dark); }
  .viewer-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .viewer-frame { flex: 1; width: 100%; border: none; background: var(--white); min-height: 0; }
  .viewer-rendered { flex: 1; overflow-y: auto; padding: 32px 48px 80px; background: var(--white); }
  .viewer-rendered-inner { max-width: 820px; margin: 0 auto; font-size: 10.5pt; line-height: 1.7; color: #222; }
  .viewer-rendered-inner h1 { font-size: 22pt; font-weight: 700; color: var(--dark); margin: 0 0 16px; line-height: 1.2; }
  .viewer-rendered-inner h2 { font-size: 16pt; font-weight: 700; color: var(--blue); margin: 28px 0 12px; line-height: 1.25; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
  .viewer-rendered-inner h3 { font-size: 13pt; font-weight: 700; color: var(--dark); margin: 22px 0 10px; line-height: 1.3; }
  .viewer-rendered-inner h4 { font-size: 11pt; font-weight: 700; color: var(--dark); margin: 16px 0 8px; }
  .viewer-rendered-inner p { margin: 0 0 14px; }
  .viewer-rendered-inner ul, .viewer-rendered-inner ol { margin: 0 0 14px 28px; }
  .viewer-rendered-inner li { margin-bottom: 6px; }
  .viewer-rendered-inner li > p { margin-bottom: 6px; }
  .viewer-rendered-inner code { font-family: 'SF Mono', Monaco, monospace; font-size: 9.5pt; background: var(--light); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; color: var(--blue); }
  .viewer-rendered-inner pre { background: var(--light); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; overflow-x: auto; margin: 0 0 14px; }
  .viewer-rendered-inner pre code { background: transparent; border: none; padding: 0; color: var(--dark); font-size: 9.5pt; line-height: 1.55; }
  .viewer-rendered-inner blockquote { border-left: 4px solid var(--blue); padding: 4px 16px; margin: 0 0 14px; background: #f7fafd; color: #444; }
  .viewer-rendered-inner table { border-collapse: collapse; width: 100%; margin: 0 0 14px; font-size: 9.5pt; }
  .viewer-rendered-inner th, .viewer-rendered-inner td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .viewer-rendered-inner th { background: var(--light); font-weight: 700; color: var(--dark); }
  .viewer-rendered-inner tr:nth-child(even) td { background: #fafbfc; }
  .viewer-rendered-inner a { color: var(--blue); text-decoration: none; border-bottom: 1px solid #c0d8ea; }
  .viewer-rendered-inner a:hover { color: var(--blue-dark); border-bottom-color: var(--blue); }
  .viewer-rendered-inner hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .viewer-rendered-inner img { max-width: 100%; height: auto; border-radius: 6px; }
  .viewer-rendered-inner strong { color: var(--dark); }
  .viewer-loading { padding: 80px 40px; text-align: center; color: var(--gray); font-size: 10.5pt; }
  .viewer-loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .viewer-error { padding: 40px; text-align: center; color: var(--red); background: #fdf0ef; border: 1px solid #f5b8aa; border-radius: 8px; margin: 32px; }
  .viewer-error strong { color: var(--red); display: block; margin-bottom: 8px; font-size: 12pt; }
  .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-size: 10.5pt; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-primary:hover { background: var(--blue-dark); }

  /* VIEWER FOOTER - quick check */
  .viewer-footer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 12px 20px; background: var(--light); }
  .quick-check { max-width: 820px; margin: 0 auto; font-size: 9.5pt; }
  .quick-check summary { cursor: pointer; font-weight: 700; color: var(--blue); list-style-position: inside; }
  .quick-check summary:hover { color: var(--blue-dark); }
  .quick-check p { margin: 8px 0 2px; color: #444; line-height: 1.6; }

  /* HELPFUL LINKS - bottom-of-view section */
  .links-section { margin-top: 56px; padding-top: 28px; border-top: 2px solid var(--border); }
  .links-title { font-size: 11pt; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
  .links-sub { font-size: 9pt; color: var(--gray); margin-bottom: 20px; }
  .links-groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .link-group-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .link-group-header { padding: 13px 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .link-group-header-label { font-size: 10pt; font-weight: 700; color: #fff; letter-spacing: 0.2px; }
  .link-group-header-icon { font-size: 15pt; line-height: 1; }
  .link-group-items { padding: 4px 0; }
  .link-group-item { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 9px 16px; text-decoration: none; color: var(--dark); border-bottom: 1px solid var(--border); transition: background .1s; }
  .link-group-item:last-child { border-bottom: none; }
  .link-group-item:hover { background: #f0f5fb; }
  .link-group-item-name { font-size: 10pt; font-weight: 600; color: var(--blue); display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 2px; }
  .link-group-item-desc { font-size: 8.5pt; color: #666; line-height: 1.45; text-align: center; }
  .link-arrow { font-size: 9pt; opacity: 0.65; }
  .link-group-card--wide { grid-column: 1 / -1; }
  .link-group-card--wide .link-group-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .link-group-card--wide .link-group-item { border-bottom: none; border-right: 1px solid var(--border); }
  .link-group-card--wide .link-group-item:last-child { border-right: none; }

  /* FOCUS VISIBILITY */
  .card:focus-visible, .tab:focus-visible, .card-fav:focus-visible, .card-read:focus-visible,
  .viewer-back:focus-visible, .viewer-readtoggle:focus-visible, .viewer-open-new:focus-visible,
  .hdr-quickref:focus-visible, .hdr-themetoggle:focus-visible, .link-group-item:focus-visible, .btn-primary:focus-visible,
  .search-input:focus-visible, .quick-check summary:focus-visible {
    outline: 2px solid var(--green); outline-offset: 2px;
  }

  @media (max-width: 700px) {
    .app-header { padding: 12px 16px; height: auto; flex-direction: column; align-items: stretch; gap: 12px; }
    .hdr-logo { align-self: flex-start; }
    .hdr-quickref { margin-left: 0; }
    .search-wrap { max-width: none; margin-left: 0; }
    .content { padding: 20px 16px 60px; }
    .aud-title { font-size: 18pt; }
    .card-grid { grid-template-columns: 1fr; }
  }

  /* DARK MODE - three-state theme.
     No data-theme attribute -> follow the OS (prefers-color-scheme) via the media query below.
     data-theme="dark"  -> force dark (block immediately below).
     data-theme="light" -> force light (the media query is excluded via :not([data-theme="light"])).
     The forced-dark block and the OS media-query block carry IDENTICAL declarations - keep them in sync. */
  :root[data-theme="dark"] { --bg: #15181d; --white: #1e232b; --border: #333b45; --light: #262c35; --gray: #9aa3ad; }
  :root[data-theme="dark"] body { color: #d7dbe0; }
  :root[data-theme="dark"] .aud-title,
  :root[data-theme="dark"] .card-title,
  :root[data-theme="dark"] .viewer-title,
  :root[data-theme="dark"] .links-title,
  :root[data-theme="dark"] .callout strong,
  :root[data-theme="dark"] .viewer-rendered-inner h1,
  :root[data-theme="dark"] .viewer-rendered-inner h3,
  :root[data-theme="dark"] .viewer-rendered-inner h4,
  :root[data-theme="dark"] .viewer-rendered-inner th,
  :root[data-theme="dark"] .viewer-rendered-inner strong,
  :root[data-theme="dark"] .link-group-item { color: #e8eaf0; }
  :root[data-theme="dark"] .card-desc { color: #b6bcc4; }
  :root[data-theme="dark"] .callout { color: #c9cfd6; }
  :root[data-theme="dark"] .links-sub,
  :root[data-theme="dark"] .aud-sub,
  :root[data-theme="dark"] .search-info { color: var(--gray); }
  :root[data-theme="dark"] .link-group-item-desc { color: #aab1b9; }
  :root[data-theme="dark"] .progress-label { color: #aab1b9; }
  :root[data-theme="dark"] .viewer-rendered-inner { color: #d7dbe0; }
  :root[data-theme="dark"] .viewer-rendered-inner h2 { color: #5fa8d3; }
  :root[data-theme="dark"] .viewer-rendered-inner a { color: #6db3e8; border-bottom-color: #3a5570; }
  :root[data-theme="dark"] .viewer-rendered-inner code { background: #262c35; color: #7fb3e0; }
  :root[data-theme="dark"] .viewer-rendered-inner pre { background: #262c35; }
  :root[data-theme="dark"] .viewer-rendered-inner pre code { color: #d7dbe0; }
  :root[data-theme="dark"] .viewer-rendered-inner blockquote { background: #20262e; color: #c9cfd6; }
  :root[data-theme="dark"] .viewer-rendered-inner tr:nth-child(even) td { background: #22272f; }
  :root[data-theme="dark"] .empty-title { color: #b6bcc4; }
  :root[data-theme="dark"] .empty-sub { color: #7f8893; }
  :root[data-theme="dark"] .section-count { background: #262c35; color: #8a929b; }

const LINKS = window.HELPFUL_LINKS;

const LS = { aud: 'sta_training_aud', favs: 'sta_training_favs', read: 'sta_training_read' };
const VALID_AUDS = ['start', 'support', 'sf-admins', 'admin', 'favorites'];

const MARKED = { src: 'https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js', sri: 'sha384-zbcZAIxlvJtNE3Dp5nxLXdXtXyxwOdnILY1TDPVmKFhl4r4nSUG1r8bcFXGVa4Te' };
const MAMMOTH = { src: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', sri: 'sha384-nFoSjZIoH3CCp8W639jJyQkuPHinJ2NHe7on1xvlUA7SuGfJAfvMldrsoAVm6ECz' };

// ---- helpers ----
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }
  catch { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage may be unavailable */ }
}

// lazy script loader: injects a CDN script once, returns a cached promise
const _scripts = {};
function loadScriptOnce(src, integrity) {
  if (_scripts[src]) return _scripts[src];
  _scripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    if (integrity) { s.integrity = integrity; s.crossOrigin = 'anonymous'; }
    s.onload = () => resolve();
    s.onerror = () => { delete _scripts[src]; reject(new Error('Failed to load resource')); };
    document.head.appendChild(s);
  });
  return _scripts[src];
}

// ---- state ----
const state = {
  activeAud: 'start',
  search: '',
  favorites: lsGet(LS.favs, []),
  read: new Set(lsGet(LS.read, [])),
  viewerDocId: null,
  lastFocusDocId: null
};
if (!Array.isArray(state.favorites)) state.favorites = [];

const el = {
  tabbar: document.getElementById('tabbar'),
  main: document.getElementById('main'),
  search: document.getElementById('search')
};

let viewerKeyHandler = null;

// ---- persistence ----
function persist() {
  lsSet(LS.aud, state.activeAud);
  lsSet(LS.favs, state.favorites);
  lsSet(LS.read, [...state.read]);
}

// ---- freshness ----
function freshness(doc) {
  const A = doc.added, U = doc.updated;
  const within14 = d => d && (Date.now() - Date.parse(d)) < 14 * 86400000;
  if (A && U && A === U) return within14(A) ? 'NEW' : null;
  if (within14(U)) return 'UPDATED';
  if (within14(A)) return 'NEW';
  return null;
}

// ---- routing ----
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const parts = h.split('/');
  const aud = parts[0];
  if (!VALID_AUDS.includes(aud)) return null;
  return { aud, doc: parts[1] || null };
}
function currentHash() {
  let h = '#' + state.activeAud;
  if (state.viewerDocId) h += '/' + state.viewerDocId;
  return h;
}
function applyRoute(r) {
  if (r.aud === 'favorites' && state.favorites.length === 0) {
    state.activeAud = 'start'; state.viewerDocId = null; return;
  }
  state.activeAud = r.aud;
  state.search = '';
  if (el.search) el.search.value = '';
  state.viewerDocId = (r.doc && DATA.docs[r.doc]) ? r.doc : null;
}
// sync URL to state, then render. push=true adds a history entry (real navigation).
function go(push) {
  const h = currentHash();
  if (location.hash !== h) {
    if (push) history.pushState(null, '', h);
    else history.replaceState(null, '', h);
  }
  persist();
  render();
}

// ---- navigation actions ----
function selectAud(audId) {
  teardownViewerFocus();
  state.activeAud = audId;
  state.viewerDocId = null;
  state.search = '';
  if (el.search) el.search.value = '';
  go(true);
}
function openDoc(docId) {
  if (!DATA.docs[docId]) return;
  teardownViewerFocus();
  state.lastFocusDocId = docId;
  state.search = '';
  if (el.search) el.search.value = '';
  state.viewerDocId = docId;
  go(true);
}
function closeViewer() {
  teardownViewerFocus();
  const focusId = state.lastFocusDocId;
  state.viewerDocId = null;
  go(true);
  if (focusId) {
    const card = el.main.querySelector('.card[data-action="open"][data-doc="' + focusId + '"]');
    if (card) card.focus();
  }
}
function toggleFav(docId) {
  const i = state.favorites.indexOf(docId);
  if (i >= 0) state.favorites.splice(i, 1); else state.favorites.push(docId);
  if (state.activeAud === 'favorites' && state.favorites.length === 0) {
    state.activeAud = 'start';
    state.viewerDocId = null;
  }
  go(false);
}
function toggleRead(docId) {
  if (state.read.has(docId)) state.read.delete(docId); else state.read.add(docId);
  go(false);
}

// ---- rendering ----
function audienceDocIds(aud) {
  const ids = [], seen = new Set();
  aud.sections.forEach(s => s.docs.forEach(id => {
    if (DATA.docs[id] && !seen.has(id)) { seen.add(id); ids.push(id); }
  }));
  return ids;
}

function render() {
  renderTabs();
  if (state.search.trim()) {
    el.main.innerHTML = '<div class="content">' + viewSearch() + '</div>';
    window.scrollTo({ top: 0 });
  } else if (state.viewerDocId) {
    const doc = DATA.docs[state.viewerDocId];
    el.main.innerHTML = viewViewer(doc);
    initViewer(doc);
    window.scrollTo({ top: 0 });
  } else if (state.activeAud === 'favorites') {
    el.main.innerHTML = '<div class="content">' + viewFavorites() + '</div>';
  } else {
    el.main.innerHTML = '<div class="content">' + viewAudience(DATA.audiences.find(a => a.id === state.activeAud)) + '</div>';
  }
}

function renderTabs() {
  const searching = !!state.search.trim();
  let html = '';
  DATA.audiences.forEach(a => {
    const active = !searching && state.activeAud === a.id;
    html += '<button class="tab' + (active ? ' tab-active' : '') + '" type="button" data-action="tab" data-aud="' + esc(a.id) + '"'
      + (active ? ' aria-current="page"' : '') + '>'
      + '<span class="tab-icon" aria-hidden="true">' + esc(a.icon) + '</span>' + esc(a.title) + '</button>';
  });
  if (state.favorites.length > 0) {
    const active = !searching && state.activeAud === 'favorites';
    html += '<button class="tab tab-saved' + (active ? ' tab-active' : '') + '" type="button" data-action="tab" data-aud="favorites"'
      + (active ? ' aria-current="page"' : '') + '>'
      + '<span class="tab-icon" aria-hidden="true">★</span>Saved'
      + '<span class="tab-badge">' + state.favorites.length + '</span></button>';
  }
  el.tabbar.innerHTML = html;
}

function freshnessChip(doc) {
  const f = freshness(doc);
  if (!f) return '';
  return '<span class="chip chip-' + (f === 'NEW' ? 'new' : 'updated') + '">' + f + '</span>';
}

function cardHTML(id, doc) {
  const fav = state.favorites.includes(id);
  const isRead = state.read.has(id);
  const pclass = 'card-' + (doc.priority || 'optional');
  const reqUnread = doc.priority === 'required' && !isRead;
  const tags = (doc.tags || []).slice(0, 2);
  let meta = '';
  if (doc.priority) meta += '<span class="pill pill-' + esc(doc.priority) + '">' + esc(doc.priority) + '</span>';
  meta += tags.map(t => '<span class="pill pill-optional">' + esc(t) + '</span>').join('');
  meta += freshnessChip(doc);
  if (reqUnread) meta += '<span class="req-unread">Required - not yet read</span>';
  meta += '<button class="card-read' + (isRead ? ' is-read' : '') + '" type="button" data-action="read" data-doc="' + esc(id) + '"'
    + ' aria-pressed="' + isRead + '" aria-label="' + (isRead ? 'Mark as unread' : 'Mark as read') + '">'
    + (isRead ? '✓ Read' : 'Mark read') + '</button>';
  return '<div class="card ' + pclass + (reqUnread ? ' card-required-unread' : '') + '"'
    + ' role="button" tabindex="0" data-action="open" data-doc="' + esc(id) + '" aria-label="Open ' + esc(doc.title) + '">'
    + '<div class="card-head"><div class="card-titleblock"><div class="card-title">' + esc(doc.title) + '</div></div>'
    + '<button class="card-fav' + (fav ? ' active' : '') + '" type="button" data-action="fav" data-doc="' + esc(id) + '"'
    + ' aria-pressed="' + fav + '" aria-label="' + (fav ? 'Remove favorite' : 'Add favorite') + '">'
    + (fav ? '★' : '☆') + '</button></div>'
    + '<div class="card-desc">' + esc(doc.desc) + '</div>'
    + '<div class="card-meta">' + meta + '</div></div>';
}

function progressBar(label, ids) {
  const done = ids.filter(id => state.read.has(id)).length;
  const pct = ids.length ? Math.round(done / ids.length * 100) : 0;
  return '<div class="progress" role="group" aria-label="' + esc(label) + '">'
    + '<div class="progress-label"><strong>' + done + ' of ' + ids.length + '</strong> ' + esc(label) + '</div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
}

function viewAudience(aud) {
  if (!aud) return '';
  let html = '<div class="aud-header"><h1 class="aud-title">' + esc(aud.title) + '</h1>'
    + '<div class="aud-sub">' + esc(aud.sub) + '</div></div>';
  let startDaySec = null;
  if (aud.id === 'start') {
    const reqSec = aud.sections.find(s => s.heading === 'Required before first use');
    startDaySec = aud.sections.find(s => s.heading === 'Recommended Day 1');
    if (reqSec) html += progressBar('required articles read', reqSec.docs);
  }
  aud.sections.forEach(sec => {
    if (startDaySec && sec.heading === 'Recommended Day 1') {
      html += progressBar('Day 1 articles read', startDaySec.docs);
    }
    html += '<section class="section"><div class="section-title">' + esc(sec.heading)
      + '<span class="section-count">' + sec.docs.length + ' ' + (sec.docs.length === 1 ? 'doc' : 'docs') + '</span></div>'
      + '<div class="card-grid">';
    sec.docs.forEach(id => { const d = DATA.docs[id]; if (d) html += cardHTML(id, d); });
    html += '</div></section>';
  });
  html += helpfulLinks();
  return html;
}

function viewSearch() {
  const q = state.search.trim().toLowerCase();
  const results = Object.keys(DATA.docs).filter(id => {
    const d = DATA.docs[id];
    return d.title.toLowerCase().includes(q)
      || d.desc.toLowerCase().includes(q)
      || (d.tags || []).some(t => t.toLowerCase().includes(q));
  });
  let html = '<div class="aud-header"><h1 class="aud-title">Search</h1>'
    + '<div class="aud-sub">' + results.length + ' ' + (results.length === 1 ? 'doc matches' : 'docs match')
    + ' <em>"' + esc(state.search) + '"</em></div></div>';
  if (!results.length) {
    html += '<div class="empty"><div class="empty-icon" aria-hidden="true">\u{1F50D}</div>'
      + '<div class="empty-title">No matches</div>'
      + '<div class="empty-sub">Try a shorter query or check the audience tabs above.</div></div>';
  } else {
    html += '<div class="card-grid">' + results.map(id => cardHTML(id, DATA.docs[id])).join('') + '</div>';
  }
  return html;
}

function viewFavorites() {
  if (state.favorites.length === 0) {
    return '<div class="empty"><div class="empty-icon" aria-hidden="true">★</div>'
      + '<div class="empty-title">No saved docs yet</div>'
      + '<div class="empty-sub">Click the star on any card to save it here for quick access.</div></div>';
  }
  let html = '<div class="aud-header"><h1 class="aud-title">Saved</h1>'
    + '<div class="aud-sub">Your starred docs. Click the star again to remove.</div></div><div class="card-grid">';
  state.favorites.forEach(id => { const d = DATA.docs[id]; if (d) html += cardHTML(id, d); });
  html += '</div>';
  html += helpfulLinks();
  return html;
}

function helpfulLinks() {
  const groups = LINKS || [];
  let html = '<div class="links-section"><div class="links-title">Helpful Links</div>'
    + '<div class="links-sub">Claude resources, Anthropic learning materials, and School Tech tools we have built.</div>'
    + '<div class="links-groups-grid">';
  groups.forEach(g => {
    html += '<div class="link-group-card' + (g.fullWidth ? ' link-group-card--wide' : '') + '">'
      + '<div class="link-group-header" style="background:' + esc(g.headerBg || '#006098') + '">'
      + (g.icon ? '<span class="link-group-header-icon" aria-hidden="true">' + esc(g.icon) + '</span>' : '')
      + '<span class="link-group-header-label">' + esc(g.label) + '</span></div><div class="link-group-items">';
    g.items.forEach(it => {
      html += '<a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer" class="link-group-item">'
        + '<div class="link-group-item-name">' + esc(it.name) + ' <span class="link-arrow" aria-hidden="true">↗</span></div>'
        + '<div class="link-group-item-desc">' + esc(it.desc) + '</div></a>';
    });
    html += '</div></div>';
  });
  html += '</div></div>';
  return html;
}

function viewViewer(doc) {
  const id = state.viewerDocId;
  const isRead = state.read.has(id);
  const isDocx = doc.type === 'docx';
  return '<div class="viewer" id="viewer">'
    + '<div class="viewer-bar">'
    + '<button class="viewer-back" type="button" data-action="back">← Back</button>'
    + '<div class="viewer-title">' + esc(doc.title) + '</div>'
    + '<button class="viewer-readtoggle" type="button" data-action="read" data-doc="' + esc(id) + '"'
    + ' aria-pressed="' + isRead + '">' + (isRead ? '✓ Read' : 'Mark as read') + '</button>'
    + (isDocx ? '<a class="viewer-download" href="' + esc(doc.file) + '" download>⬇ Download</a>' : '')
    + '<button class="viewer-open-new" type="button" data-action="open-new" data-file="' + esc(doc.file) + '">Open in new tab ↗</button>'
    + '</div>'
    + '<div class="viewer-body" id="viewer-body"></div>'
    + (doc.check ? '<div class="viewer-footer"><details class="quick-check"><summary>Quick check</summary><p>' + esc(doc.check) + '</p></details></div>' : '')
    + '</div>';
}

function initViewer(doc) {
  const body = document.getElementById('viewer-body');
  if (!body) return;
  if (doc.type === 'html' || doc.type === 'pdf') {
    const sandbox = doc.type === 'html' ? ' sandbox="allow-same-origin allow-scripts allow-popups allow-forms"' : '';
    body.innerHTML = '<iframe class="viewer-frame" src="' + esc(doc.file) + '" title="' + esc(doc.title) + '"' + sandbox + '></iframe>';
  } else if (doc.type === 'pptx') {
    body.innerHTML = '<div class="viewer-rendered"><div class="viewer-rendered-inner">'
      + '<h1>' + esc(doc.title) + '</h1>'
      + '<p style="color:#666;font-style:italic;">PowerPoint presentations can’t be rendered inline in the browser. Use the button below to open it in a new tab - your computer will use the PowerPoint app or web viewer to display it.</p>'
      + '<p style="margin-top:24px;"><button class="btn-primary" type="button" data-action="open-new" data-file="' + esc(doc.file) + '">Open ' + esc(doc.title) + ' ↗</button></p>'
      + '</div></div>';
  } else {
    body.innerHTML = '<div class="viewer-rendered"><div class="viewer-loading">'
      + '<div class="viewer-loading-spinner"></div>'
      + '<div>Loading ' + (doc.type === 'docx' ? 'Word document' : 'document') + '...</div></div></div>';
    renderFetched(doc, body);
  }
  setupViewerFocus();
}

async function renderFetched(doc, body) {
  try {
    let inner;
    if (doc.type === 'md') {
      await loadScriptOnce(MARKED.src, MARKED.sri);
      const r = await fetch(doc.file);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      if (!window.marked) throw new Error('marked.js not loaded');
      inner = window.marked.parse(text, { breaks: true, gfm: true });
    } else if (doc.type === 'docx') {
      await loadScriptOnce(MAMMOTH.src, MAMMOTH.sri);
      const r = await fetch(doc.file);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const buffer = await r.arrayBuffer();
      if (!window.mammoth) throw new Error('mammoth.js not loaded');
      const result = await window.mammoth.convertToHtml({ arrayBuffer: buffer });
      inner = result.value || '<p><em>Document is empty.</em></p>';
    } else {
      return;
    }
    if (!document.body.contains(body)) return; // user navigated away mid-fetch
    // inner is parsed document content from marked/mammoth (intentionally rendered as HTML)
    body.innerHTML = '<div class="viewer-rendered"><div class="viewer-rendered-inner">' + inner + '</div></div>';
  } catch (e) {
    if (!document.body.contains(body)) return;
    body.innerHTML = '<div class="viewer-rendered"><div class="viewer-error">'
      + '<strong>Could not load document</strong>' + esc(e.message)
      + '<p style="margin-top:12px;"><button class="btn-primary" type="button" data-action="open-new" data-file="' + esc(doc.file) + '">Try opening in a new tab instead ↗</button></p>'
      + '</div></div>';
  }
}

// ---- viewer focus management (trap + Esc + return focus) ----
function setupViewerFocus() {
  const viewer = document.getElementById('viewer');
  if (!viewer) return;
  const back = viewer.querySelector('.viewer-back');
  if (back) back.focus();
  viewerKeyHandler = function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
    if (e.key !== 'Tab') return;
    const focusable = [...viewer.querySelectorAll('a[href],button:not([disabled]),iframe,summary,[tabindex]:not([tabindex="-1"])')]
      .filter(x => x.tagName === 'IFRAME' || x.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', viewerKeyHandler);
}
function teardownViewerFocus() {
  if (viewerKeyHandler) { document.removeEventListener('keydown', viewerKeyHandler); viewerKeyHandler = null; }
}

// ---- theme toggle (manual light/dark, overrides OS, persists) ----
const THEME_ICON = {
  // moon: shown when the effective theme is LIGHT (clicking switches to dark)
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
  // sun: shown when the effective theme is DARK (clicking switches to light)
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>'
};
function effectiveTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'dark' || attr === 'light') return attr;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function updateThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const dark = effectiveTheme() === 'dark';
  btn.innerHTML = dark ? THEME_ICON.sun : THEME_ICON.moon;
  btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('sta_training_theme', next); } catch (e) { /* storage may be unavailable */ }
  updateThemeToggle();
}
function setupThemeToggle() {
  updateThemeToggle();
  // If the OS theme changes while the user has NOT set a manual override, keep the icon in sync.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (!document.documentElement.getAttribute('data-theme')) updateThemeToggle(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
}

// ---- event delegation ----
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.getAttribute('data-action');
  if (a === 'tab') selectAud(t.getAttribute('data-aud'));
  else if (a === 'open') openDoc(t.getAttribute('data-doc'));
  else if (a === 'fav') { e.stopPropagation(); toggleFav(t.getAttribute('data-doc')); }
  else if (a === 'read') { e.stopPropagation(); toggleRead(t.getAttribute('data-doc')); }
  else if (a === 'back') closeViewer();
  else if (a === 'open-new') window.open(t.getAttribute('data-file'), '_blank', 'noopener,noreferrer');
  else if (a === 'quickref') openDoc('quick-ref');
  else if (a === 'theme') toggleTheme();
});

// Enter / Space activates a focused card (cards are role=button, not <button>)
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card[role="button"]');
  if (card && e.target === card) {
    e.preventDefault();
    openDoc(card.getAttribute('data-doc'));
  }
});

// Search is ephemeral (not part of the hash); typing closes any open viewer.
el.search.addEventListener('input', () => {
  state.search = el.search.value;
  if (state.viewerDocId) {
    teardownViewerFocus();
    state.viewerDocId = null;
    history.replaceState(null, '', '#' + state.activeAud);
  }
  render();
});

// Browser Back/Forward: restore state from the hash (this keeps the browser
// Back button stepping through tabs/docs within the site instead of leaving it).
window.addEventListener('popstate', () => {
  teardownViewerFocus();
  const r = parseHash();
  if (r) applyRoute(r);
  else { state.viewerDocId = null; state.search = ''; if (el.search) el.search.value = ''; }
  persist();
  render();
});

// ---- init ----
(function init() {
  const r = parseHash();
  if (r) {
    applyRoute(r);
  } else {
    const saved = lsGet(LS.aud, 'start');
    state.activeAud = (typeof saved === 'string' && VALID_AUDS.includes(saved)) ? saved : 'start';
    if (state.activeAud === 'favorites' && state.favorites.length === 0) state.activeAud = 'start';
    state.viewerDocId = null;
  }
  setupThemeToggle();
  go(false); // replaceState to a canonical hash + first render
})();
</script>
