  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 11pt; pointer-events: none; }

  .tab:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .tab-active { color: #fff; border-bottom-color: var(--green); background: rgba(255,255,255,0.1); }
  .tab-saved { color: #f5d76e !important; }
  .tab-saved.tab-active { border-bottom-color: #f5d76e !important; }
  .tab-icon { font-size: 12pt; line-height: 1; }
  .tab-badge { display: inline-flex; align-items: center; justify-content: center; background: #f0b429; color: var(--dark); border-radius: 10px; font-size: 7pt; font-weight: 700; min-width: 18px; height: 16px; padding: 0 4px; margin-left: 4px; }

  .content { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 28px 32px 60px; }

  /* AUDIENCE HEADER */
  .aud-header { margin-bottom: 28px; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
  .pill { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill-required { background: #e8f2f8; color: var(--blue); border: 1px solid #c0d8ea; }
  .pill-recommended { background: #edf7e6; color: var(--green-dark); border: 1px solid #b8e0a0; }
  .pill-optional { background: var(--light); color: var(--gray); border: 1px solid var(--border); }

  .pill-pptx { background: #fdf0ef; color: var(--red); border: 1px solid #f5b8aa; }

// COMPONENTS
// =============================================================

function App() {
  const data = window.TRAINING_DATA;
  const [activeAud, setActiveAud] = useState(() => {
    const saved = localStorage.getItem('sta_training_aud');
    return saved && data.audiences.find(a => a.id === saved) ? saved : 'start';
  });
  const [search, setSearch] = useState('');
  const [favorites, setFavorites] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('sta_training_favs') || '[]');
    } catch { return []; }
  });

  useEffect(() => { localStorage.setItem('sta_training_aud', activeAud); }, [activeAud]);
  useEffect(() => { localStorage.setItem('sta_training_favs', JSON.stringify(favorites)); }, [favorites]);

  const toggleFav = useCallback((docId) => {
    setFavorites(prev => prev.includes(docId) ? prev.filter(id => id !== docId) : [...prev, docId]);
  }, []);

  // Search across all docs
  const searchResults = useMemo(() => {
    if (!search.trim()) return null;
    const q = search.trim().toLowerCase();
    const matches = Object.entries(data.docs)
      .filter(([id, doc]) =>
        doc.title.toLowerCase().includes(q) ||
        doc.desc.toLowerCase().includes(q) ||
        (doc.tags || []).some(t => t.toLowerCase().includes(q))
      )
      .map(([id]) => id);
    return matches;
  }, [search, data.docs]);

  const aud = data.audiences.find(a => a.id === activeAud);
  const hasFavorites = favorites.length > 0;

  return (
    <div className="app">
      <Header search={search} setSearch={setSearch} />
      <TabBar
        audiences={data.audiences}
        activeAud={activeAud}
        setActiveAud={setActiveAud}
        hasFavorites={hasFavorites}
        favoritesCount={favorites.length}
      />
      <div className="content">
        {search.trim() ? (
          <SearchResults
            results={searchResults}
            docs={data.docs}
            favorites={favorites}
            toggleFav={toggleFav}
            query={search}
          />
        ) : activeAud === 'favorites' ? (
          <FavoritesView
            favorites={favorites}
            docs={data.docs}
            toggleFav={toggleFav}
          />
        ) : (
          <AudienceView
            audience={aud}
            docs={data.docs}
            favorites={favorites}
            toggleFav={toggleFav}
          />
        )}
      </div>
      <Footer />
    </div>
  );
}

function Header({ search, setSearch }) {
  return (
    <header className="app-header">
      <div className="hdr-brand">
        <div className="hdr-title">STA AI Training Hub</div>
        <div className="hdr-sub">School Technology Associates &middot; Internal</div>
      </div>
      <div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input
          type="text"
          className="search-input"
          placeholder="Search all docs..."
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>
    </header>
  );
}

function TabBar({ audiences, activeAud, setActiveAud, hasFavorites, favoritesCount }) {
  return (
    <nav className="tab-bar">
      {audiences.map(aud => (
        <button
          key={aud.id}
          className={`tab ${activeAud === aud.id ? 'tab-active' : ''}`}
          onClick={() => setActiveAud(aud.id)}
        >
          <span className="tab-icon">{aud.icon}</span>
          {aud.title}
        </button>
      ))}
      {hasFavorites && (
        <button
          className={`tab tab-saved ${activeAud === 'favorites' ? 'tab-active' : ''}`}
          onClick={() => setActiveAud('favorites')}
        >
          <span className="tab-icon">⭐</span>
          Saved
          <span className="tab-badge">{favoritesCount}</span>
        </button>
      )}
    </nav>
  );
}

function AudienceView({ audience, docs, favorites, toggleFav }) {
  if (!audience) return null;
  return (
    <div>
      <div className="aud-header">
        <div className="aud-title">{audience.title}</div>
        <div className="aud-sub">{audience.sub}</div>
      </div>
      {audience.sections.map((sec, i) => (
        <div className="section" key={i}>
          <div className="section-title">
            {sec.heading}
            <span className="section-count">{sec.docs.length} {sec.docs.length === 1 ? 'doc' : 'docs'}</span>
          </div>
          <div className="card-grid">
            {sec.docs.map(docId => {
              const doc = docs[docId];
              if (!doc) return null;
              return (
                <DocCard
                  key={docId}
                  docId={docId}
                  doc={doc}
                  isFav={favorites.includes(docId)}
                  toggleFav={toggleFav}
                />
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function SearchResults({ results, docs, favorites, toggleFav, query }) {
  return (
    <div>
      <div className="aud-header">
        <div className="aud-title">Search</div>
        <div className="aud-sub">{results.length} {results.length === 1 ? 'doc matches' : 'docs match'} <em>"{query}"</em></div>
      </div>
      {results.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">🔍</div>
          <div className="empty-title">No matches</div>
          <div className="empty-sub">Try a shorter query or check the audience tabs above.</div>
        </div>
      ) : (
        <div className="card-grid">
          {results.map(docId => (
            <DocCard
              key={docId}
              docId={docId}
              doc={docs[docId]}
              isFav={favorites.includes(docId)}
              toggleFav={toggleFav}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function FavoritesView({ favorites, docs, toggleFav }) {
  if (favorites.length === 0) {
    return (
      <div className="empty">
        <div className="empty-icon">⭐</div>
        <div className="empty-title">No saved docs yet</div>
        <div className="empty-sub">Click the star on any card to save it here for quick access.</div>
      </div>
    );
  }
  return (
    <div>
      <div className="aud-header">
        <div className="aud-title">Saved</div>
        <div className="aud-sub">Your starred docs. Click the star again to remove.</div>
      </div>
      <div className="card-grid">
        {favorites.map(docId => {
          const doc = docs[docId];
          if (!doc) return null;
          return (
            <DocCard
              key={docId}
              docId={docId}
              doc={doc}
              isFav={true}
              toggleFav={toggleFav}
            />
          );
        })}
      </div>
    </div>
  );
}

function DocCard({ docId, doc, isFav, toggleFav }) {
  const handleClick = (e) => {
    // Don't open doc when clicking the favorite button
    if (e.target.closest('.card-fav')) return;
    window.open(doc.file, '_blank', 'noopener,noreferrer');
  };
  const handleFavClick = (e) => {
    e.stopPropagation();
    toggleFav(docId);
  };
  const priorityClass = `card-${doc.priority || 'optional'}`;
  return (
    <div className={`card ${priorityClass}`} onClick={handleClick} title={`Open ${doc.title}`}>
      <div className="card-head">
        <div className="card-icon">{doc.icon || '\u{1F4C4}'}</div>
        <div className="card-titleblock">
          <div className="card-title">{doc.title}</div>
          <div className="card-filename">{doc.file}</div>
        </div>
        <button
          className={`card-fav ${isFav ? 'active' : ''}`}
          onClick={handleFavClick}
          title={isFav ? 'Remove from saved' : 'Save for quick access'}
          aria-label={isFav ? 'Remove from saved' : 'Save for quick access'}
        >
          {isFav ? '\u{2605}' : '\u{2606}'}
        </button>
      </div>
      <div className="card-desc">{doc.desc}</div>
      <div className="card-meta">
        {doc.priority && (
          <span className={`pill pill-${doc.priority}`}>{doc.priority}</span>
        )}
        {doc.type && (
          <span className={`pill pill-${doc.type}`}>{doc.type.toUpperCase()}</span>
        )}
        {(doc.tags || []).slice(0, 2).map(t => (
          <span key={t} className="pill pill-optional">{t}</span>
        ))}
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer className="app-footer">
      <strong>STA AI Training Hub</strong> &middot; Maintained by Adam Baker &middot; Updated 2026-05-21 &middot; <a href="mailto:adamb@k12sta.com">adamb@k12sta.com</a>
    </footer>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
