<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML / CSS / JS Effects Lab</title>
<style>
  :root{
    --accent:#4f46e5; --accent2:#06b6d4; --ink:#1f2433; --muted:#6b7180;
    --line:#e5e7f0; --bg:#f6f7fb; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:.75rem 1.25rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
  header.top h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:-.01em}
  header.top .sub{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:.1rem}
  .search{margin-left:auto;display:flex;gap:.6rem;align-items:center}
  .search input{font:inherit;font-size:.85rem;padding:.45rem .7rem;border:1px solid var(--line);border-radius:9px;width:240px;max-width:46vw}
  .count{font-size:.72rem;color:var(--muted);white-space:nowrap}
  .cats{display:flex;flex-wrap:wrap;gap:.4rem;padding:.65rem 1.25rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:19}
  .cats button{font:inherit;font-size:.74rem;font-weight:700;padding:.3rem .7rem;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;cursor:pointer}
  .cats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:1rem 1.25rem 2rem;max-width:1180px;margin:0 auto}
  .sec-h{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:1.7rem .2rem .75rem;padding-bottom:.35rem;border-bottom:2px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
  .fx{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .fx-h{padding:.65rem .85rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line)}
  .fx-h .t{font-size:.85rem;font-weight:700}
  .fx-h .tag{margin-left:auto;font-size:.58rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.18rem .45rem;border-radius:999px;background:#eef0f9;color:#4a4f6b;white-space:nowrap}
  .fx-h .tag.js{background:#fff4e0;color:#92560a}
  .stage{padding:1.6rem 1rem;display:grid;place-items:center;min-height:128px;background:#fff;gap:.6rem}
  .stage.dk{background:#10122a}
  .note{font-size:.72rem;color:var(--muted);padding:0 .85rem .2rem}
  details.code{border-top:1px solid var(--line);font-size:.78rem}
  details.code>summary{cursor:pointer;padding:.5rem .85rem;font-weight:700;color:var(--muted);list-style:none;display:flex;align-items:center;gap:.4rem}
  details.code>summary::-webkit-details-marker{display:none}
  details.code>summary::before{content:"▸";font-size:.7rem}
  details.code[open]>summary::before{content:"▾"}
  .code-wrap{position:relative}
  .code-wrap pre{margin:0;padding:.85rem 1rem;background:#0f1226;color:#e6e8f5;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;line-height:1.55;max-height:360px}
  .copy{position:absolute;top:.5rem;right:.5rem;font:inherit;font-size:.68rem;font-weight:700;padding:.3rem .55rem;border:1px solid #2a2e52;background:#1c1f3d;color:#cfd2ee;border-radius:7px;cursor:pointer}
  .copy.ok{background:#16a34a;border-color:#16a34a;color:#fff}
  .empty{padding:3rem 1rem;text-align:center;color:var(--muted);grid-column:1/-1}
  footer{padding:2rem 1.25rem;text-align:center;color:var(--muted);font-size:.72rem}
  footer b{color:var(--ink)}
  .toc{margin:.4rem 0 1.1rem;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .toc>summary{cursor:pointer;list-style:none;padding:.7rem .9rem;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:.4rem}
  .toc>summary::-webkit-details-marker{display:none}
  .toc>summary::before{content:"▸";font-size:.7rem;color:var(--muted)}
  .toc[open]>summary::before{content:"▾"}
  .toc .tocn{color:var(--muted);font-weight:600}
  .toc-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:.7rem 1.3rem;padding:.2rem 1rem 1.1rem}
  .toc-h{font-size:.63rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:.35rem 0 .35rem;padding-bottom:.25rem;border-bottom:1px solid var(--line)}
  .toc-col a{display:block;font-size:.78rem;color:#3a4060;text-decoration:none;padding:.13rem 0}
  .toc-col a:hover{color:var(--accent)}
  .fx.flash{outline:3px solid var(--accent);outline-offset:3px;animation:fxflash 1.3s ease}
  @keyframes fxflash{0%{outline-color:var(--accent)}100%{outline-color:transparent}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>HTML / CSS / JS Effects Lab</h1>

</header>
<div class="cats" id="cats"></div>
<main id="main"></main>
<footer>Every demo renders the <b>exact</b> code shown. Basic/utility layer &mdash; companion to the 48-effect creative gallery. Built for Adam.</footer>

);
const main=document.getElementById('main');
const catsEl=document.getElementById('cats');
const q=document.getElementById('q');
const countEl=document.getElementById('count');
const cats=[...new Set(FX.map(f=>f.cat))];
let active='All';

function catBtn(name){const b=document.createElement('button');b.textContent=name;
  if(name===active)b.classList.add('on');
  b.onclick=()=>{active=name;[...catsEl.children].forEach(c=>c.classList.toggle('on',c.textContent===name));render();};
  return b;}
catsEl.appendChild(catBtn('All'));cats.forEach(c=>catsEl.appendChild(catBtn(c)));

function makeCard(f){
  const card=document.createElement('div');card.className='fx';card.id=f.id;
  const hh=document.createElement('div');hh.className='fx-h';
  const t=document.createElement('span');t.className='t';t.textContent=f.title;
  const tag=document.createElement('span');tag.className='tag'+(f.js?' js':'');tag.textContent=f.js?'HTML+JS':'CSS';
  hh.append(t,tag);card.appendChild(hh);
  const stage=document.createElement('div');stage.className='stage';stage.innerHTML=f.code;card.appendChild(stage);
  if(f.note){const n=document.createElement('div');n.className='note';n.textContent=f.note;card.appendChild(n);}
  const d=document.createElement('details');d.className='code';
  const s=document.createElement('summary');s.textContent='Show code';d.appendChild(s);
  const wrap=document.createElement('div');wrap.className='code-wrap';
  const pre=document.createElement('pre');pre.textContent=f.code;
  const cp=document.createElement('button');cp.className='copy';cp.textContent='Copy';
  cp.onclick=()=>{navigator.clipboard.writeText(f.code);cp.textContent='Copied!';cp.classList.add('ok');
    setTimeout(()=>{cp.textContent='Copy';cp.classList.remove('ok');},1200);};
  wrap.append(pre,cp);d.appendChild(wrap);card.appendChild(d);
  return card;
}
function buildTOC(){
  const wrap=document.createElement('details');wrap.className='toc';wrap.open=true;
  const sm=document.createElement('summary');
  sm.innerHTML='All effects by category <span class="tocn">('+FX.length+')</span>';wrap.appendChild(sm);
  const body=document.createElement('div');body.className='toc-body';
  cats.forEach(cat=>{
    const col=document.createElement('div');col.className='toc-col';
    const hh=document.createElement('div');hh.className='toc-h';hh.textContent=cat;col.appendChild(hh);
    FX.filter(f=>f.cat===cat).forEach(f=>{
      const a=document.createElement('a');a.href='#'+f.id;a.textContent=f.title;
      a.onclick=e=>{e.preventDefault();jumpTo(f.id);};col.appendChild(a);
    });
    body.appendChild(col);
  });
  wrap.appendChild(body);return wrap;
}
function jumpTo(id){
  active='All';q.value='';
  [...catsEl.children].forEach(c=>c.classList.toggle('on',c.textContent==='All'));
  render();
  const el=document.getElementById(id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1300);}
}
function render(){
  main.innerHTML='';
  const term=q.value.trim().toLowerCase();
  let shown=0;
  main.appendChild(buildTOC());
  cats.forEach(cat=>{
    if(active!=='All'&&active!==cat)return;
    const items=FX.filter(f=>f.cat===cat&&(!term||(f.title+' '+f.cat+' '+f.code).toLowerCase().includes(term)));
    if(!items.length)return;
    const hh=document.createElement('div');hh.className='sec-h';hh.textContent=cat;main.appendChild(hh);
    const g=document.createElement('div');g.className='grid';
    items.forEach(f=>{g.appendChild(makeCard(f));shown++;});
    main.appendChild(g);
  });
  if(!shown){const e=document.createElement('div');e.className='empty';e.textContent='No effects match "'+term+'".';main.appendChild(e);}
  countEl.textContent=shown+' / '+FX.length+' effects';
  wire();
}
q.addEventListener('input',render);

function wire(){
  document.querySelectorAll('.mi1').forEach(b=>{if(b._w)return;b._w=1;b.addEventListener('click',e=>{
    const s=document.createElement('span');s.className='rp';const r=b.getBoundingClientRect();
    s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';
    s.style.width=s.style.height=Math.max(r.width,r.height)+'px';b.appendChild(s);setTimeout(()=>s.remove(),600);});});
  document.querySelectorAll('.mi5').forEach(b=>{if(b._w)return;b._w=1;b.addEventListener('click',()=>{
    navigator.clipboard.writeText(b.dataset.copy);const t=b.textContent;b.classList.add('ok');b.textContent='Copied!';
    setTimeout(()=>{b.classList.remove('ok');b.textContent=t;},1200);});});
  document.querySelectorAll('.ch4').forEach(w=>{if(w._w)return;w._w=1;const bx=w.querySelectorAll('input'),fl=w.querySelector('i'),n=w.querySelector('.n');
    w.addEventListener('change',()=>{const d=[...bx].filter(x=>x.checked).length;n.textContent=d;fl.style.width=(d/bx.length*100)+'%';});});
  document.querySelectorAll('.tx3').forEach(el=>{if(el._w)return;el._w=1;
    new IntersectionObserver((es,o)=>es.forEach(en=>{if(!en.isIntersecting)return;o.unobserve(el);
      const to=+el.dataset.to;let st=null;const step=ti=>{st=st||ti;const p=Math.min((ti-st)/1200,1);
        el.textContent=Math.floor(p*to).toLocaleString();if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);})).observe(el);});
  document.querySelectorAll('.sc1').forEach(c=>{if(c._w)return;c._w=1;
    const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)en.target.classList.add('in');}),{root:c,threshold:.4});
    c.querySelectorAll('.it').forEach(it=>io.observe(it));});
  document.querySelectorAll('.sc3').forEach(w=>{if(w._w)return;w._w=1;const t=w.querySelector('.toast');
    w.querySelector('button').addEventListener('click',()=>{t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);});});
  document.querySelectorAll('.ns1').forEach(c=>{if(c._w)return;c._w=1;c.addEventListener('pointermove',e=>{
    const r=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-r.left)+'px');c.style.setProperty('--y',(e.clientY-r.top)+'px');});});
  document.querySelectorAll('.nt1').forEach(c=>{if(c._w)return;c._w=1;
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
      c.style.transform='perspective(600px) rotateY('+(px*16)+'deg) rotateX('+(-py*16)+'deg)';});
    c.addEventListener('pointerleave',()=>c.style.transform='perspective(600px) rotateX(0) rotateY(0)');});
}
render();
</script>
