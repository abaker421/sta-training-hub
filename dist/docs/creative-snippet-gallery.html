<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Snippet Gallery — 89 Live Effects</title>
<style>
:root{ --accent:#4f46e5; --accent-2:#06b6d4; --nav-w:262px; }
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:#f5f6fa;color:#1a1a2e;line-height:1.5}
/* ---- Sidebar ---- */
.nav{position:fixed;inset:0 auto 0 0;width:var(--nav-w);z-index:50;background:#14172e;color:#c6c9e0;
  overflow-y:auto;padding:1rem 0 1rem;display:flex;flex-direction:column;gap:.15rem}
.nav-title{padding:.25rem 1.1rem .6rem;color:#fff;font-weight:700;font-size:.95rem;border-bottom:1px solid #262a4a;
  display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.nav-title span{font-size:.68rem;font-weight:600;color:#7c81a8}
.nav h3{margin:1rem 0 .2rem;padding:0 1.1rem;font-size:.66rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#7c81a8}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.32rem 1.1rem;
  color:#c6c9e0;text-decoration:none;font-size:.8rem;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:#1d2140;color:#fff}
.nav a.active{background:#232852;color:#fff;border-left-color:var(--accent)}
.nav a .dot{inline-size:8px;aspect-ratio:1;border-radius:50%;flex-shrink:0}
.dot.dropin{background:#4ade80}
.dot.section{background:#fbbf24}
.nav-theme{margin-top:auto;padding:1rem 1.1rem 0;border-top:1px solid #262a4a;font-size:.72rem;color:#7c81a8}
.nav-theme .sw{display:flex;gap:.45rem;margin-top:.5rem}
.pg-swatch{inline-size:24px;aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid #14172e;
  box-shadow:0 0 0 1px #3a3f6b;padding:0}
.pg-swatch.on{box-shadow:0 0 0 2px #fff}
/* ---- Main ---- */
main{margin-left:var(--nav-w);padding:1.5rem 2rem 4rem;max-width:980px}
.panel{display:block}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-top:.5rem}
.p-sec{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a8fa8}
.p-head h2{margin:.15rem 0 0;font-size:1.45rem}
.tag{font-size:.58rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.2rem .5rem;
  border-radius:999px;white-space:nowrap}
.tag.dropin{background:#dcfce7;color:#166534}
.tag.section{background:#fef3c7;color:#92560a}
.p-desc{color:#555a77;max-width:75ch}
.p-stage{margin-top:1.25rem;padding:2rem 1.5rem;border:1px solid #e3e5f0;border-radius:14px;background:#fff}
.p-stage.dark{background:#0f1226}
.p-meta{font-size:.8rem;color:#8a8fa8;margin-top:1rem}
.p-meta code,.p-desc code{background:#ecedf6;padding:.05rem .35rem;border-radius:4px}
.p-stage.dark + .p-meta{color:#8a8fa8}
/* ---- Code block ---- */
details.code{margin-top:1.5rem;border:1px solid #e3e5f0;border-radius:12px;overflow:hidden;background:#fff}
details.code>summary{cursor:pointer;list-style:none;padding:.6rem .9rem;font-weight:700;font-size:.82rem;
  color:#555a77;display:flex;align-items:center;gap:.4rem}
details.code>summary::-webkit-details-marker{display:none}
details.code>summary::before{content:"▸";font-size:.7rem}
details.code[open]>summary::before{content:"▾"}
.code-wrap{position:relative;border-top:1px solid #e3e5f0}
.code-wrap pre{margin:0;padding:.9rem 1rem;background:#0f1226;color:#e6e8f5;overflow:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;line-height:1.55;max-height:440px}
.copy{position:absolute;top:.6rem;right:.6rem;font:inherit;font-size:.68rem;font-weight:700;padding:.3rem .55rem;
  border:1px solid #2a2e52;background:#1c1f3d;color:#cfd2ee;border-radius:7px;cursor:pointer}
.copy.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.p-footer{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;font-size:.78rem;color:#8a8fa8}
.p-footer a{text-decoration:none;color:var(--accent);font-weight:600;border-bottom:1px solid transparent}
.p-footer a:hover{border-color:var(--accent)}
/* ---- Home ---- */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:1.5rem}
.home-card{background:#fff;border:1px solid #e3e5f0;border-radius:12px;padding:1rem 1.1rem;font-size:.85rem;color:#555a77}
.home-card h3{margin:0 0 .4rem;font-size:.78rem}
.home-card a{color:var(--accent);text-decoration:none}
@media (max-width:760px){.nav{position:static;width:auto}main{margin-left:0}}
</style>
</head>
<body>
<aside class="nav">
  <div class="nav-title">Snippet Gallery <span>89 effects</span></div>
  <div id="navlist"></div>
  <div class="nav-theme">Theme — every snippet recolors via <code style="color:#c6c9e0">--accent</code>:

  </div>
</aside>
<main id="main"></main>

ent, #4f46e5), rgb(0 0 0 / .08) 70%) border-box;\n}\n<\/style>\n<div class=\"fx-spot\" style=\"max-width:340px;\"><h3 style=\"margin:0 0 .3rem;\">Active users<\/h3><p style=\"margin:0; font-size:1.6rem; font-weight:800;\">12,940<\/p><\/div>\n<script>\ndocument.querySelectorAll('.fx-spot').forEach(card => {\n  card.addEventListener('pointermove', e => {\n    const r = card.getBoundingClientRect();\n    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');\n    card.style.setProperty('--my', (e.clientY - r.top) + 'px');\n  });\n});\n<\/script>", "desc": "A card whose border glows where the pointer is - subtler than the tilt card, built for grids of KPI cards. Move your cursor across it. No motion runs without deliberate pointer movement, so no reduced-motion block is needed.", "meta": "Theming: <code>--accent<\/code>, <code>--bg-card<\/code>, <code>--text<\/code> · Support: universal · Module 2 + 4 (double-background border trick + pointer-tracking custom properties)"}, {"id": "s10", "cat": "C - Transitions & scroll", "title": "S10 - Reveal-on-scroll cards", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-reveal { opacity: 1; }\n@supports (animation-timeline: view()) {\n  @media (prefers-reduced-motion: no-preference) {\n    .fx-reveal {\n      animation: fx-reveal-in linear both;\n      animation-timeline: view();\n      animation-range: entry 0% cover 35%;\n    }\n  }\n}\n@keyframes fx-reveal-in {\n  from { opacity: 0; transform: translateY(70px) scale(.95); }\n  to { opacity: 1; transform: none; }\n}\n<\/style>", "desc": "Cards fade and rise as they enter the viewport - pure CSS scroll-driven animation (<code>animation-timeline: view()<\/code>), no JS, no observers. Scroll down through this tab and watch each card animate in; scroll back up and re-enter them.", "meta": "Theming: none needed - inherits everything · Support: Chrome 115+, Safari 26; not yet Baseline - the @supports gate is mandatory (unsupported browsers just show the cards) · Module 1"}, {"id": "s11", "cat": "C - Transitions & scroll", "title": "S11 - Reading progress bar", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-s11 { position: relative; width: 280px; height: 160px; overflow: auto;\n  border: 1px solid #e3e5f0; border-radius: 12px; background: #fff; }\n.fx-s11 .bar { position: sticky; top: 0; height: 4px; transform-origin: left;\n  transform: scaleX(.18); background: var(--accent, #4f46e5);\n  box-shadow: 0 0 8px var(--accent, #4f46e5); }\n@supports (animation-timeline: scroll()) {\n  .fx-s11 .bar { transform: scaleX(0); animation: fx-s11-grow linear both;\n    animation-timeline: scroll(nearest block); }\n}\n@keyframes fx-s11-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n.fx-s11 .body { padding: .7rem .9rem; font: .8rem/1.5 system-ui; color: #555a77; height: 380px; }\n@media (prefers-reduced-motion: reduce) { .fx-s11 .bar { animation: none; transform: scaleX(.4); } }\n<\/style>\n<div class=\"fx-s11\"><div class=\"bar\"><\/div>\n  <div class=\"body\">Scroll this panel &#8595; the top bar tracks reading progress &#8212;\n  page-wide in a real report, scoped here so it stays visible. Zero JS via\n  <code>animation-timeline: scroll()<\/code>; the fallback bar shows a resolved state.<\/div>\n<\/div>", "desc": "A glowing brand-colored bar pinned to the very top edge of the window (shown only on this tab in the gallery; in a real report it runs page-wide). Tracks scroll position via <code>animation-timeline: scroll()<\/code> (with a JS shadow driver in this gallery). Scroll this tab: the bar grows and the big percentage below mirrors it.", "meta": "Theming: <code>--accent<\/code> · The one fixed-position exception in the library - 4px tall, aria-hidden, hidden entirely under reduced motion · Support: same gate as S10; unsupported browsers show nothing · Module 1"}, {"id": "s12", "cat": "C - Transitions & scroll", "title": "S12 - Scroll-scrubbed parallax divider", "tag": "section", "dark": false, "js": false, "code": "<style>\n.fx-parallax { position: relative; block-size: 320px; overflow: hidden; border-radius: 12px;\n  background: linear-gradient(to bottom, #0f1226, #2a2356 75%, #3d2a63); }\n.fx-parallax-sun { position: absolute; left: 18%; top: 100%; width: 90px; aspect-ratio: 1;\n  border-radius: 50%; background: var(--accent-2, #06b6d4);\n  box-shadow: 0 0 60px 18px color-mix(in oklch, var(--accent-2, #06b6d4) 55%, transparent); }\n.fx-parallax-back { position: absolute; inset: auto 0 0 0; height: 75%;\n  background: color-mix(in oklch, var(--accent, #4f46e5) 45%, #0f1226);\n  clip-path: polygon(0 62%, 12% 38%, 25% 55%, 40% 25%, 55% 52%, 70% 30%, 84% 50%, 100% 34%, 100% 100%, 0 100%); }\n.fx-parallax-front { position: absolute; inset: auto -2% -2% -2%; height: 70%;\n  background: color-mix(in oklch, var(--accent, #4f46e5) 80%, black);\n  clip-path: polygon(0 75%, 10% 52%, 22% 70%, 38% 40%, 52% 66%, 68% 44%, 82% 64%, 100% 48%, 100% 100%, 0 100%); }\n.fx-parallax-label { position: absolute; inset: 0; display: grid; place-items: center;\n  font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: .35em;\n  color: rgb(255 255 255 / .95); text-shadow: 0 2px 24px rgb(0 0 0 / .7); }\n.fx-parallax-pct { position: absolute; right: .9rem; bottom: .7rem; font-size: .75rem; font-weight: 700;\n  letter-spacing: .06em; color: rgb(255 255 255 / .85); font-variant-numeric: tabular-nums; }\n<\/style>", "desc": "A full-width band whose layers move at different rates as you scroll past - scrubbed by scroll position, not a clock. Two mountain ridges slide apart, the sun rises, and the word flies the opposite direction; the \"scrub %\" readout in the corner mirrors your exact scroll position. Scroll up and down across it slowly.", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code>, <code>--bg<\/code> · Needs its own fixed-height container - hence SECTION-PIECE · Support: same gate as S10; degrades to a static layered band · Module 1"}, {"id": "s13", "cat": "C - Transitions & scroll", "title": "S13 - View-transition panel switcher", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-vt section { view-transition-name: fx-panel; padding: 1rem 0; font-size: .9rem; }\n.fx-vt [role=\"tab\"] {\n  border: none; background: none; padding: .5rem 1rem; cursor: pointer;\n  border-bottom: 2px solid transparent; color: var(--text-muted, #667); font: inherit;\n}\n.fx-vt [role=\"tab\"][aria-selected=\"true\"] { color: var(--accent, #4f46e5); border-color: var(--accent, #4f46e5); }\n::view-transition-old(fx-panel) { animation-duration: .18s; }\n::view-transition-new(fx-panel) { animation-duration: .25s; }\n@media (prefers-reduced-motion: reduce) {\n  ::view-transition-old(fx-panel), ::view-transition-new(fx-panel) { animation: none; }\n}\n<\/style>\n<div class=\"fx-vt\">\n      <nav role=\"tablist\">\n        <button role=\"tab\" aria-selected=\"true\" data-panel=\"fx-p1\">Summary<\/button>\n        <button role=\"tab\" aria-selected=\"false\" data-panel=\"fx-p2\">Detail<\/button>\n      <\/nav>\n      <section id=\"fx-p1\" role=\"tabpanel\">Q2 closed at 104% of plan. Three deals slipped to July; all three have signed LOIs.<\/section>\n      <section id=\"fx-p2\" role=\"tabpanel\" hidden>Largest slip: Northfield district ($84K) - board vote moved to 7/14. Pipeline coverage for Q3 sits at 3.1x with 22 qualified opportunities.<\/section>\n    <\/div>\n<script>\ndocument.querySelectorAll('.fx-vt [role=\"tab\"]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const swap = () => {\n      const vt = btn.closest('.fx-vt');\n      vt.querySelectorAll('[role=\"tab\"]').forEach(b => b.setAttribute('aria-selected', b === btn));\n      vt.querySelectorAll('[role=\"tabpanel\"]').forEach(p => p.hidden = p.id !== btn.dataset.panel);\n    };\n    document.startViewTransition ? document.startViewTransition(swap) : swap();\n  });\n});\n<\/script>", "desc": "Tab panels that cross-fade and morph when switched via the View Transitions API - app-quality motion in a single-file dashboard. Click between the tabs. Fully keyboard-accessible.", "meta": "Theming: <code>--accent<\/code>, <code>--text-muted<\/code> · Only one visible element per page may hold a given view-transition-name · Support: Chrome 111+, Safari 18+; feature check makes unsupported browsers switch instantly · Module 1"}, {"id": "s14", "cat": "D - Interactive moments", "title": "S14 - 3D tilt card with glare", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-tilt {\n  --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;\n  position: relative; padding: 1.5rem; border-radius: 14px; overflow: hidden;\n  background: var(--bg-card, #fff); color: var(--text, #1a1a2e);\n  border: 1px solid rgb(0 0 0 / .08);\n  transform: perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));\n  transition: transform .15s ease-out;\n}\n.fx-tilt::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background: radial-gradient(220px at var(--mx) var(--my), rgb(255 255 255 / .35), transparent 70%);\n  opacity: 0; transition: opacity .2s;\n}\n.fx-tilt:hover::after { opacity: 1; }\n@media (prefers-reduced-motion: reduce) { .fx-tilt { transform: none !important; } }\n<\/style>\n<div class=\"fx-tilt\" style=\"max-width:340px;\">\n      <h3 style=\"margin:0 0 .3rem;\">Conversion rate<\/h3><p style=\"margin:0; font-size:1.5rem; font-weight:800;\">4.8% <span style=\"font-size:.9rem; color:#0d8a4f;\">(+0.6 pts)<\/span><\/p>\n    <\/div>\n<script>\ndocument.querySelectorAll('.fx-tilt').forEach(card => {\n  card.addEventListener('pointermove', e => {\n    const r = card.getBoundingClientRect();\n    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;\n    card.style.setProperty('--ry', ((px - .5) * 10).toFixed(2) + 'deg');\n    card.style.setProperty('--rx', ((.5 - py) * 10).toFixed(2) + 'deg');\n    card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');\n    card.style.setProperty('--my', (py * 100).toFixed(1) + '%');\n  });\n  card.addEventListener('pointerleave', () => {\n    card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg');\n  });\n});\n<\/script>", "desc": "The \"Apple TV card\": tilts toward the pointer with a moving sheen. One pointermove handler writing custom properties - no layout reads in the loop. Hover and move around it. Keep tilt under 12deg in data-dense layouts.", "meta": "Theming: <code>--bg-card<\/code>, <code>--text<\/code> · Tilt strength is the <code>* 10<\/code> factor · Support: universal; transform disabled under reduced motion · Module 4"}, {"id": "s16", "cat": "D - Interactive moments", "title": "S16 - Magnetic button", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-mag-field { display: inline-block; padding: 22px; }\n.fx-mag {\n  padding: .7rem 1.4rem; border: none; border-radius: 10px; cursor: pointer;\n  background: var(--accent, #4f46e5); color: #fff; font-weight: 600; font: inherit;\n  transform: translate(var(--tx, 0), var(--ty, 0));\n  transition: transform .25s cubic-bezier(.2,.7,.3,1.3);\n}\n<\/style>\n<span class=\"fx-mag-field\"><button class=\"fx-mag\">Download report<\/button><\/span>\n<script>\nif (!matchMedia('(prefers-reduced-motion: reduce)').matches)\n  document.querySelectorAll('.fx-mag-field').forEach(field => {\n    const btn = field.querySelector('.fx-mag');\n    field.addEventListener('pointermove', e => {\n      const r = field.getBoundingClientRect();\n      btn.style.setProperty('--tx', ((e.clientX - r.left - r.width / 2) * .3).toFixed(1) + 'px');\n      btn.style.setProperty('--ty', ((e.clientY - r.top - r.height / 2) * .3).toFixed(1) + 'px');\n    });\n    field.addEventListener('pointerleave', () => {\n      btn.style.setProperty('--tx', '0px'); btn.style.setProperty('--ty', '0px');\n    });\n  });\n<\/script>", "desc": "A CTA that leans toward the pointer within a proximity field and springs back on leave. The padded wrapper around the button IS the proximity zone. Disables itself entirely under reduced motion.", "meta": "Theming: <code>--accent<\/code> · Pull strength is the <code>.3<\/code> factor · Support: universal · Module 4"}, {"id": "s17", "cat": "D - Interactive moments", "title": "S17 - Spring toggle with linear() easing", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-toggle { display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; color: var(--text, #1a1a2e); }\n.fx-toggle input { position: absolute; opacity: 0; }\n.fx-toggle-track {\n  inline-size: 46px; block-size: 26px; border-radius: 999px; position: relative;\n  background: color-mix(in oklch, var(--text, #1a1a2e) 25%, transparent);\n  transition: background .25s;\n}\n.fx-toggle-track::after {\n  content: \"\"; position: absolute; inset: 3px auto 3px 3px; inline-size: 20px;\n  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3);\n  transition: translate .5s linear(0, .3, .7, 1.08, 1.12, 1.04, .99, .98, 1);\n}\n.fx-toggle input:checked + .fx-toggle-track { background: var(--accent, #4f46e5); }\n.fx-toggle input:checked + .fx-toggle-track::after { translate: 20px 0; }\n.fx-toggle input:focus-visible + .fx-toggle-track { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n@media (prefers-reduced-motion: reduce) { .fx-toggle-track::after { transition-duration: .01s; } }\n<\/style>\n<label class=\"fx-toggle\">\n      <input type=\"checkbox\"><span class=\"fx-toggle-track\" aria-hidden=\"true\"><\/span> Include archived\n    <\/label>", "desc": "The knob overshoots and settles like a physical spring - pure CSS via a hand-tuned <code>linear()<\/code> curve. Click it. The 1.12 peak in the curve is the bounce - widen it for more.", "meta": "Theming: <code>--accent<\/code>, <code>--text<\/code> · Support: linear() Baseline 2023; older browsers get the fallback ease · Module 4"}, {"id": "s18", "cat": "D - Interactive moments", "title": "S18 - Button ripple", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-ripple {\n  position: relative; overflow: hidden; padding: .7rem 1.4rem; border: none;\n  border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;\n  background: var(--accent, #4f46e5); color: #fff;\n}\n<\/style>\n<button class=\"fx-ripple\">Apply filters<\/button>\n<script>\ndocument.querySelectorAll('.fx-ripple').forEach(btn => {\n  btn.addEventListener('click', e => {\n    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;\n    const dot = document.createElement('span');\n    Object.assign(dot.style, {\n      position: 'absolute', borderRadius: '50%', pointerEvents: 'none',\n      background: 'rgb(255 255 255 / .45)', width: d + 'px', height: d + 'px',\n      left: e.clientX - r.left - d / 2 + 'px', top: e.clientY - r.top - d / 2 + 'px'\n    });\n    btn.appendChild(dot);\n    dot.animate(\n      [{ transform: 'scale(0)', opacity: 1 }, { transform: 'scale(1)', opacity: 0 }],\n      { duration: 500, easing: 'ease-out' }\n    ).finished.then(() => dot.remove());\n  });\n});\n<\/script>", "desc": "Material-style ripple from the exact click point - Web Animations API, ripple element self-removes when finished. Click it a few times in different spots.", "meta": "Theming: <code>--accent<\/code> · Works on any element with <code>position: relative; overflow: hidden<\/code> · Support: universal (WAAPI Baseline 2020) · Module 4"}, {"id": "s19", "cat": "D - Interactive moments", "title": "S19 - Confetti burst", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-confetti {\n  padding: .7rem 1.4rem; border: none; border-radius: 10px; cursor: pointer;\n  font: inherit; font-weight: 600; background: var(--accent, #4f46e5); color: #fff;\n}\n<\/style>\n<button class=\"fx-confetti\">Goal reached<\/button>\n<script>\ndocument.querySelectorAll('.fx-confetti').forEach(btn => {\n  btn.addEventListener('click', () => {\n    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const r = btn.getBoundingClientRect();\n    const rootStyle = getComputedStyle(document.documentElement);\n    const colors = [\n      rootStyle.getPropertyValue('--accent').trim() || '#4f46e5',\n      rootStyle.getPropertyValue('--accent-2').trim() || '#06b6d4',\n      '#f59e0b', '#ec4899'\n    ];\n    for (let i = 0; i < 30; i++) {\n      const p = document.createElement('span');\n      Object.assign(p.style, {\n        position: 'fixed', left: r.left + r.width / 2 + 'px', top: r.top + 'px',\n        width: '8px', height: '12px', pointerEvents: 'none', zIndex: 999,\n        background: colors[i % colors.length], borderRadius: '2px'\n      });\n      document.body.appendChild(p);\n      const ang = Math.random() * Math.PI - Math.PI, v = 80 + Math.random() * 140;\n      p.animate([\n        { transform: 'translate(0,0) rotate(0)', opacity: 1 },\n        { transform: `translate(${Math.cos(ang) * v}px, ${Math.sin(ang) * v - 60}px) rotate(${Math.random() * 540 - 270}deg)`, opacity: 1, offset: .6 },\n        { transform: `translate(${Math.cos(ang) * v * 1.2}px, ${Math.sin(ang) * v + 160}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }\n      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' })\n        .finished.then(() => p.remove());\n    }\n  });\n});\n<\/script>", "desc": "Canvas-free celebration: ~30 fixed-position particles animated with the Web Animations API, self-removing when done. The vanilla answer to canvas-confetti. Click it.", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code> (first two confetti colors) · The only snippet that appends to body - fixed-position, pointer-events: none, self-removing · Support: universal · Module 4"}, {"id": "s20", "cat": "D - Interactive moments", "title": "S20 - Scramble-decode headline", "tag": "dropin", "dark": false, "js": true, "code": "<h2 class=\"fx-scramble\" style=\"margin:.25rem 0; font-size:1.8rem;\">Q2 Performance Review<\/h2>\n<script>\n(() => {\n  const el = document.querySelector('.fx-scramble');\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const text = el.textContent, chars = '!<>-_\\\\/[]{}*^?#';\n  let running = false;\n  function run() {\n    if (reduced || running) return;\n    running = true;\n    let frame = 0;\n    el.setAttribute('aria-label', text);\n    (function tick() {\n      frame++;\n      const resolved = Math.floor(frame / 3);\n      el.textContent = text.split('').map((c, i) =>\n        i < resolved || c === ' ' ? c : chars[Math.floor(Math.random() * chars.length)]\n      ).join('');\n      if (resolved < text.length) requestAnimationFrame(tick);\n      else { el.textContent = text; el.removeAttribute('aria-label'); running = false; }\n    })();\n  }\n  window.fxInit = window.fxInit || {};\n  window.fxInit.s20 = run;\n})();\n<\/script>", "desc": "Text resolves from random characters left to right - the terminal decode effect. Runs each time you open this tab; the real text is held in an aria-label while scrambling so screen readers never see noise.", "meta": "Theming: none - inherits the heading's styles · Speed is the <code>/ 3<\/code> divisor (frames per character) · Support: universal; reduced motion shows the text immediately · Module 3"}, {"id": "s22", "cat": "E - Loaders", "title": "S22 - Staggered dot loader", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-dots { display: inline-flex; gap: 8px; }\n.fx-dots span {\n  inline-size: 12px; aspect-ratio: 1; border-radius: 50%;\n  background: var(--accent, #4f46e5);\n  animation: fx-dots-pulse 1s ease-in-out infinite;\n}\n.fx-dots span:nth-child(2) { animation-delay: .15s; }\n.fx-dots span:nth-child(3) { animation-delay: .3s; }\n@keyframes fx-dots-pulse { 0%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }\n@media (prefers-reduced-motion: reduce) {\n  .fx-dots span { animation: fx-dots-fade 2s ease-in-out infinite; transform: none; }\n}\n@keyframes fx-dots-fade { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }\n<\/style>\n<div class=\"fx-dots\" role=\"status\" aria-label=\"Loading\">\n      <span><\/span><span><\/span><span><\/span>\n    <\/div>", "desc": "Three dots breathing in sequence - the workhorse loader. Under reduced motion the scale pulse swaps for a slow opacity fade: still signals \"working\" without movement.", "meta": "Theming: <code>--accent<\/code> · Pattern family popularized by Temani Afif's css-loaders.com; code written fresh · Support: universal · Module 4"}, {"id": "s23", "cat": "E - Loaders", "title": "S23 - Conic ring spinner", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-spin {\n  inline-size: 44px; aspect-ratio: 1; border-radius: 50%;\n  background: conic-gradient(transparent 10%, var(--accent, #4f46e5));\n  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));\n  animation: fx-spin-rotate .8s linear infinite;\n}\n@keyframes fx-spin-rotate { to { rotate: 1turn; } }\n@media (prefers-reduced-motion: reduce) { .fx-spin { animation-duration: 2.4s; } }\n<\/style>\n<div class=\"fx-spin\" role=\"status\" aria-label=\"Loading\"><\/div>", "desc": "A tapered-tail ring spinner from a single element: a conic-gradient punched into a ring with a CSS mask. Reduced motion slows the rotation rather than freezing it - a frozen partial ring reads as broken.", "meta": "Theming: <code>--accent<\/code> · Ring thickness is the 5px/4px pair in the mask · Support: mask Baseline 2023 · Module 2"}, {"id": "s24", "cat": "E - Loaders", "title": "S24 - SVG path draw loader", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-pathload { inline-size: 96px; }\n.fx-pathload path {\n  stroke: var(--accent, #4f46e5); stroke-width: 3; stroke-linecap: round;\n  stroke-dasharray: 40 60;\n  animation: fx-pathload-run 1.6s linear infinite;\n}\n@keyframes fx-pathload-run { to { stroke-dashoffset: -100; } }\n@media (prefers-reduced-motion: reduce) { .fx-pathload path { animation-duration: 4s; } }\n<\/style>\n<svg class=\"fx-pathload\" viewBox=\"0 0 64 32\" role=\"status\" aria-label=\"Loading\">\n      <path pathLength=\"100\" fill=\"none\"\n        d=\"M16,16 C16,7 28,7 32,16 C36,25 48,25 48,16 C48,7 36,7 32,16 C28,25 16,25 16,16 Z\"/>\n    <\/svg>", "desc": "A line that draws and undraws along a path - swap the <code>d<\/code> attribute for your logo mark. <code>pathLength=\"100\"<\/code> keeps the dash math constant for any path.", "meta": "Theming: <code>--accent<\/code> · Support: universal · Module 4"}, {"id": "s25", "cat": "F - Report charts", "title": "S25 - Animated bar chart with count-up labels", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-bars { --max: 600; display: grid; grid-auto-flow: column; gap: 1rem; align-items: end;\n  height: 220px; padding: 1rem; font-variant-numeric: tabular-nums; }\n.fx-bars .bar { display: grid; grid-template-rows: 1fr auto auto; height: 100%; gap: .35rem;\n  justify-items: center; align-items: end; }\n.fx-bars i { width: 100%; border-radius: 6px 6px 2px 2px; align-self: end;\n  height: calc(var(--v) / var(--max) * 100%);\n  background: linear-gradient(to top, var(--accent, #4f46e5), color-mix(in oklch, var(--accent, #4f46e5), white 25%)); }\n.fx-bars b { font-size: .85rem; color: var(--text, #1f2937); }\n.fx-bars span { font-size: .75rem; color: var(--muted, #6b7280); }\n@media (prefers-reduced-motion: no-preference) {\n  .fx-bars.fx-armed i { transform-origin: bottom; scale: 1 0;\n    transition: scale .6s cubic-bezier(.2,.7,.3,1) calc(var(--i) * 90ms); }\n  .fx-bars.fx-go i { scale: 1 1; }\n}\n@media print { .fx-bars i { scale: 1 1 !important; transition: none !important; } }\n<\/style>\n<div class=\"fx-bars\" role=\"img\" aria-label=\"Tickets by quarter: Q1 320, Q2 480, Q3 410, Q4 560\">\n      <div class=\"bar\" style=\"--v:320;--i:0\"><b>320<\/b><i><\/i><span>Q1<\/span><\/div>\n      <div class=\"bar\" style=\"--v:480;--i:1\"><b>480<\/b><i><\/i><span>Q2<\/span><\/div>\n      <div class=\"bar\" style=\"--v:410;--i:2\"><b>410<\/b><i><\/i><span>Q3<\/span><\/div>\n      <div class=\"bar\" style=\"--v:560;--i:3\"><b>560<\/b><i><\/i><span>Q4<\/span><\/div>\n    <\/div>\n<script>\n(() => {\n  const el = document.querySelector('.fx-bars:not([data-init])'); if (!el) return;\n  el.dataset.init = 1;\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  el.classList.add('fx-armed');\n  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { el.classList.add('fx-go'); o.disconnect();\n    el.querySelectorAll('.bar').forEach(b => {\n      const t = +b.style.getPropertyValue('--v'), out = b.querySelector('b'), t0 = performance.now();\n      const d = 600 + (+b.style.getPropertyValue('--i')) * 90;\n      (function tick(n) { const p = Math.min((n - t0) / d, 1);\n        out.textContent = Math.round(t * (1 - Math.pow(1 - p, 3)));\n        if (p < 1) requestAnimationFrame(tick); })(t0);\n    }); } }, { threshold: .4 }).observe(el);\n})();\n<\/script>", "desc": "Grid-layout bars scale in staggered on first view while labels count to value. Pure CSS bars + a small IntersectionObserver trigger. One-shot: it plays the first time it enters view.", "meta": "Theming: <code>--accent<\/code>, <code>--text<\/code>, <code>--muted<\/code>; <code>--max<\/code> = axis ceiling · Support: @property Baseline 2024, IO universal · Module 11"}, {"id": "s26", "cat": "F - Report charts", "title": "S26 - Conic donut KPI ring", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n@property --fx-p2 { syntax: \"<number>\"; inherits: true; initial-value: 0; }\n.fx-donut2 { position: relative; width: 140px; aspect-ratio: 1; display: grid; place-items: center;\n  font-variant-numeric: tabular-nums; }\n.fx-donut2 .ring { position: absolute; inset: 0; border-radius: 50%; --fx-p2: 0;\n  background: conic-gradient(var(--accent, #4f46e5) calc(var(--fx-p2) * 1%), var(--track, #e5e7eb) 0);\n  mask: radial-gradient(closest-side, transparent calc(100% - 14px), #000 calc(100% - 13.5px)); }\n.fx-donut2.fx-go .ring { --fx-p2: var(--p); transition: --fx-p2 1s cubic-bezier(.2,.7,.3,1); }\n@media (prefers-reduced-motion: reduce), print { .fx-donut2 .ring { --fx-p2: var(--p) !important; transition: none !important; } }\n.fx-donut2 .val { text-align: center; color: var(--text, #1f2937); }\n.fx-donut2 b { display: block; font-size: 1.5rem; }\n.fx-donut2 span { font-size: .72rem; color: var(--muted, #6b7280); }\n<\/style>\n<div class=\"fx-donut2\" style=\"--p:72\">\n      <div class=\"ring\" aria-hidden=\"true\"><\/div>\n      <div class=\"val\"><b>72%<\/b><span>resolved<\/span><\/div>\n    <\/div>\n<script>\n(() => { const el = document.querySelector('.fx-donut2:not([data-init])'); if (!el) return;\n  el.dataset.init = 1;\n  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { el.classList.add('fx-go'); o.disconnect(); } },\n    { threshold: .5 }).observe(el);\n})();\n<\/script>", "desc": "Single-value donut sweeping to its percentage via @property interpolation of the conic-gradient stop - the value sits in the hole as real text. One-shot on first view.", "meta": "Theming: <code>--accent<\/code> (sweep), <code>--track<\/code> (rail), <code>--p<\/code> inline per KPI · Support: @property + conic + mask all Baseline; falls back to instant render · Module 11"}, {"id": "s27", "cat": "F - Report charts", "title": "S27 - SVG line chart with draw-in and area fill", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-line { margin: 0; }\n.fx-line svg { width: 100%; height: auto; display: block; }\n.fx-line .l { fill: none; stroke: var(--accent, #4f46e5); stroke-width: 2.5;\n  vector-effect: non-scaling-stroke; stroke-linejoin: round; }\n.fx-line .a { fill: url(#fxlg); opacity: 0; }\n.fx-line .d { fill: var(--accent, #4f46e5); }\n.fx-line .d:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n@media (prefers-reduced-motion: no-preference) {\n  .fx-line.fx-go .l { stroke-dasharray: 1; stroke-dashoffset: 1; animation: fx-line-draw 1.1s ease-out forwards; }\n  .fx-line.fx-go .a { animation: fx-line-area .5s ease-out .7s forwards; }\n}\n.fx-line:not(.fx-go) .a { opacity: .35; }\n@media (prefers-reduced-motion: reduce) { .fx-line .a { opacity: .35; } }\n@keyframes fx-line-draw { to { stroke-dashoffset: 0; } }\n@keyframes fx-line-area { to { opacity: .35; } }\n@media print { .fx-line .l { animation: none !important; stroke-dasharray: none !important; }\n  .fx-line .a { opacity: .35 !important; animation: none !important; } }\n<\/style>\n<figure class=\"fx-line\" data-values=\"12,18,14,22,26,21,30,34\" data-labels=\"Jan,Feb,Mar,Apr,May,Jun,Jul,Aug\">\n      <svg viewBox=\"0 0 600 200\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Monthly trend, rising from 12 in Jan to 34 in Aug\"><\/svg>\n    <\/figure>\n<script>\n(() => {\n  const f = document.querySelector('.fx-line:not([data-init])'); if (!f) return; f.dataset.init = 1;\n  const svg = f.querySelector('svg'), W = 600, H = 200, P = 8;\n  const v = f.dataset.values.split(',').map(Number), lb = (f.dataset.labels || '').split(',');\n  const min = Math.min(...v), max = Math.max(...v);\n  const X = i => P + i / (v.length - 1) * (W - 2 * P);\n  const Y = n => H - P - (n - min) / (max - min) * (H - 2 * P);\n  const pts = v.map((n, i) => `${X(i)},${Y(n)}`).join(' ');\n  svg.innerHTML = `\n    <defs><linearGradient id=\"fxlg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"var(--accent, #4f46e5)\" stop-opacity=\".8\"/>\n      <stop offset=\"1\" stop-color=\"var(--accent, #4f46e5)\" stop-opacity=\"0\"/><\/linearGradient><\/defs>\n    <polygon class=\"a\" points=\"${X(0)},${H - P} ${pts} ${X(v.length - 1)},${H - P}\"/>\n    <polyline class=\"l\" pathLength=\"1\" points=\"${pts}\"/>` +\n    v.map((n, i) => `<circle class=\"d\" r=\"4\" cx=\"${X(i)}\" cy=\"${Y(n)}\" tabindex=\"0\" role=\"img\"\n      aria-label=\"${lb[i] || i}: ${n}\"><title>${lb[i] || i}: ${n}<\/title><\/circle>`).join('');\n  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { f.classList.add('fx-go'); o.disconnect(); } },\n    { threshold: .4 }).observe(f);\n})();\n<\/script>", "desc": "Hand-rolled polyline from a data array: draw-on entrance, gradient area fade, focusable dots with native tooltips (hover or Tab to them). Data lives in data-attributes - regenerate-friendly for templated reports.", "meta": "Theming: <code>--accent<\/code> (line, area, dots) · Support: universal SVG · Module 11 + 9 · Note: gallery uses the corrected CSS (the module's original had an invalid nested @media - now patched)"}, {"id": "s28", "cat": "F - Report charts", "title": "S28 - Heatmap cells with OKLCH scale", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-heat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 420px;\n  font: .78rem/1.6 system-ui, sans-serif; font-variant-numeric: tabular-nums; }\n.fx-heat > div { aspect-ratio: 1.4; display: grid; place-items: center; border-radius: 6px;\n  background: color-mix(in oklch, var(--accent, #4f46e5), var(--bg, #fff) calc(100% - var(--v) * 1%));\n  color: color-mix(in oklch, var(--text, #1f2937), var(--bg, #fff) calc(var(--v) * 1% - 20%)); }\n.fx-heat > div[style*=\"--v:9\"], .fx-heat > div[style*=\"--v:8\"], .fx-heat > div[style*=\"--v:7\"]\n  { color: var(--bg, #fff); }\n@media (prefers-reduced-motion: no-preference) {\n  .fx-heat.fx-armed > div { opacity: 0; transition: opacity .4s ease-out calc(var(--i, 0) * 30ms); }\n  .fx-heat.fx-go > div { opacity: 1; }\n}\n@media print { .fx-heat > div { opacity: 1 !important; } }\n<\/style>\n<div class=\"fx-heat\" role=\"img\" aria-label=\"Activity by weekday and week, darker is busier\">\n      <div style=\"--v:15\">15<\/div><div style=\"--v:40\">40<\/div><div style=\"--v:75\">75<\/div><div style=\"--v:90\">90<\/div>\n      <div style=\"--v:30\">30<\/div><div style=\"--v:65\">65<\/div><div style=\"--v:55\">55<\/div><div style=\"--v:20\">20<\/div>\n    <\/div>\n<script>\n(() => { const el = document.querySelector('.fx-heat:not([data-init])'); if (!el) return; el.dataset.init = 1;\n  [...el.children].forEach((c, i) => c.style.setProperty('--i', i));\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  el.classList.add('fx-armed');\n  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { el.classList.add('fx-go'); o.disconnect(); } },\n    { threshold: .3 }).observe(el);\n})();\n<\/script>", "desc": "Grid heatmap colored by color-mix in OKLCH from the single accent - switch theme swatches and the whole scale re-derives. Staggered fade entrance, values readable in every cell.", "meta": "Theming: <code>--accent<\/code> (scale hue), <code>--bg<\/code>, <code>--text<\/code> · Support: color-mix Baseline 2023 · Module 11 + 16"}, {"id": "s29", "cat": "F - Report charts", "title": "S29 - Bullet chart KPI row", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-bullets { display: grid; gap: .8rem; font-variant-numeric: tabular-nums; }\n.fx-bullets .b { display: grid; grid-template-columns: 9rem 1fr 3.2rem; align-items: center; gap: .75rem;\n  font-size: .85rem; color: var(--text, #1f2937); }\n.fx-bullets span { color: var(--muted, #6b7280); }\n.fx-bullets i { position: relative; height: 14px; border-radius: 4px;\n  background: linear-gradient(to right,\n    color-mix(in oklch, var(--text, #333), var(--bg, #fff) 78%) 0 60%,\n    color-mix(in oklch, var(--text, #333), var(--bg, #fff) 86%) 0 85%,\n    color-mix(in oklch, var(--text, #333), var(--bg, #fff) 93%) 0); }\n.fx-bullets i::before { content: \"\"; position: absolute; inset: 4px auto 4px 0; width: calc(var(--v) * 1%);\n  border-radius: 2px; background: var(--accent, #4f46e5); }\n.fx-bullets i::after { content: \"\"; position: absolute; inset: 0 auto 0 calc(var(--t) * 1% - 1px); "><\/div>\n    <p style=\"margin:0;\">Start of the next...<\/p>", "desc": "A section divider with an organic turbulence-displaced edge - feTurbulence + feDisplacementMap instead of the usual wave-path SVG. Static filter: zero runtime cost. Same seed = same waveline every render.", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code> (gradient ends); <code>seed<\/code> in the filter · Support: SVG filters universal · Module 9"}, {"id": "s31", "cat": "G - Section architecture", "title": "S31 - Depth-stacked hero (pseudo-3D diorama)", "tag": "section", "dark": true, "js": true, "code": "<style>\n.fx-diorama { --p: 900; perspective: calc(var(--p) * 1px); background: var(--bg, #14141c);\n  overflow: hidden; border-radius: 12px; }\n.fx-diorama .scene { position: relative; min-height: 260px; transform-style: preserve-3d;\n  transform: rotateX(calc(var(--ry, 0) * -4deg)) rotateY(calc(var(--rx, 0) * 4deg));\n  transition: transform .25s ease-out; display: grid; place-items: center; padding: 2.5rem; }\n.fx-diorama .layer { grid-area: 1 / 1; }\n.fx-diorama .back { position: absolute; inset: -8%; transform: translateZ(-60px) scale(calc((var(--p) + 60) / var(--p)));\n  background: radial-gradient(circle at 30% 20%, color-mix(in oklch, var(--accent, #4f46e5), transparent 55%), transparent 60%),\n              radial-gradient(circle at 80% 80%, color-mix(in oklch, var(--accent-2, #06b6d4), transparent 65%), transparent 55%); }\n.fx-diorama .mid { transform: translateZ(40px) scale(calc((var(--p) - 40) / var(--p)));\n  color: var(--text, #fff); text-align: center; }\n.fx-diorama .mid h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); }\n.fx-diorama .front { transform: translateZ(80px) scale(calc((var(--p) - 80) / var(--p)));\n  align-self: end; color: color-mix(in oklch, var(--text, #fff), transparent 30%); font-size: .9rem; }\n@media print { .fx-diorama .scene, .fx-diorama .layer { transform: none !important; } }\n<\/style>\n<header class=\"fx-diorama\">\n      <div class=\"scene\">\n        <div class=\"layer back\" aria-hidden=\"true\"><\/div>\n        <div class=\"layer mid\"><h1>Annual Technology Report<\/h1><\/div>\n        <div class=\"layer front\"><p>School Technology Associates - 2026<\/p><\/div>\n      <\/div>\n    <\/header>\n<script>\n(() => {\n  const d = document.querySelector('.fx-diorama:not([data-init])'); if (!d) return; d.dataset.init = 1;\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches || matchMedia('(pointer: coarse)').matches) return;\n  d.addEventListener('pointermove', e => {\n    const r = d.getBoundingClientRect();\n    d.style.setProperty('--rx', ((e.clientX - r.left) / r.width - .5) * 2);\n    d.style.setProperty('--ry', ((e.clientY - r.top) / r.height - .5) * 2);\n  });\n  d.addEventListener('pointerleave', () => { d.style.setProperty('--rx', 0); d.style.setProperty('--ry', 0); });\n})();\n<\/script>", "desc": "Cover band with three layers at different translateZ depths, tilting gently toward the pointer with scale compensation so nothing shifts size. Move your cursor across it. Flat at rest, flat in print, disabled on touch.", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code> (glow layers), <code>--bg<\/code>, <code>--text<\/code> · Event-driven, zero idle cost · Support: 3D transforms universal · Module 10 + 4"}, {"id": "s32", "cat": "G - Section architecture", "title": "S32 - Sticky chapter scene (scrollytelling stepper)", "tag": "section", "dark": false, "js": true, "code": "<style>\n.fx-scene2 { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }\n.fx-scene2 .stage { position: sticky; top: 10vh; height: 80vh; display: grid; place-items: center;\n  border-radius: 14px; background: color-mix(in oklch, var(--accent, #4f46e5), var(--bg, #fff) 92%); }\n.fx-scene2 .s { grid-area: 1 / 1; font-size: 2rem; font-weight: 700; color: var(--accent, #4f46e5);\n  opacity: 0; translate: 0 12px; transition: opacity .35s ease, translate .35s ease; }\n.fx-scene2[data-step=\"1\"] .s1, .fx-scene2[data-step=\"2\"] .s2, .fx-scene2[data-step=\"3\"] .s3\n  { opacity: 1; translate: 0 0; }\n.fx-scene2 .step { min-height: 75vh; display: grid; align-content: center; }\n@media (prefers-reduced-motion: reduce) { .fx-scene2 .s { transition: none; } }\n@media (max-width: 760px) { .fx-scene2 { grid-template-columns: 1fr; } .fx-scene2 .stage { height: 38vh; top: 0; } }\n@media print { .fx-scene2 .stage { position: static; height: auto; padding: 1rem; }\n  .fx-scene2 .s { opacity: 1 !important; position: static; translate: none; } }\n<\/style>\n<script>\n(() => {\n  const sc = document.querySelector('.fx-scene2:not([data-init])'); if (!sc) return; sc.dataset.init = 1;\n  sc.dataset.step = \"1\";\n  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) sc.dataset.step = e.target.dataset.n; }),\n    { rootMargin: \"-40% 0px -50%\" });\n  sc.querySelectorAll('.step').forEach(s => io.observe(s));\n})();\n<\/script>", "desc": "The scrollytelling atom: a sticky stage + scrolling steps. As each step enters the reading band, the stage swaps state. Scroll through it - the left panel stays put while Phase 1/2/3 crossfade. Pattern popularized by The Pudding. Owns ~225vh of page by design.", "meta": "Theming: <code>--accent<\/code>, <code>--bg<\/code> · Swap the stage text for S25/S27 charts per step for a data story · Support: sticky + IO universal · Module 13"}, {"id": "s33", "cat": "G - Section architecture", "title": "S33 - Snap-section story nav dots", "tag": "section", "dark": false, "js": false, "code": "<style>\n.fx-story { height: 70vh; overflow-y: auto; scroll-snap-type: y mandatory; border-radius: 12px;\n  background: var(--surface, #fff); border: 1px solid #e3e5f0; position: relative; }\n.fx-story section { height: 100%; scroll-snap-align: start; scroll-snap-stop: always;\n  display: grid; place-items: center; color: var(--text, #1f2937); }\n.fx-story .fallback { position: sticky; bottom: 1rem; display: flex; gap: .5rem; justify-content: center; }\n.fx-story .fallback a { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center;\n  font-size: .7rem; text-decoration: none; color: var(--text, #1f2937);\n  background: color-mix(in oklch, var(--accent, #4f46e5), transparent 85%); }\n@supports (scroll-marker-group: after) {\n  .fx-story { scroll-marker-group: after; }\n  .fx-story .fallback { display: none; }\n  .fx-story::scroll-marker-group { position: sticky; bottom: 1rem; align-self: center;\n    display: flex; gap: .55rem; }\n  .fx-story section::scroll-marker { content: \"\"; width: .65rem; aspect-ratio: 1; border-radius: 50%;\n    background: color-mix(in oklch, var(--accent, #4f46e5), transparent 70%); }\n  .fx-story section::scroll-marker:target-current { background: var(--accent, #4f46e5); }\n  .fx-story section::scroll-marker:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n}\n@media print { .fx-story { height: auto; overflow: visible; } .fx-story section { height: auto; padding: 2rem; } }\n<\/style>", "desc": "Scroll-snap chapter deck with native CSS scroll-marker dots where supported, anchor-link fallback elsewhere. Scroll inside the box - sections snap, the active dot tracks. Snap is contained to the component's own scroller, never the page.", "meta": "Theming: <code>--accent<\/code>, <code>--surface<\/code>, <code>--text<\/code> · Support: scroll-marker Chrome/Edge 135+, Safari 18.2+ (@supports-gated, fast-moving) · Module 13"}, {"id": "s34", "cat": "H - Interactive (wave 2)", "title": "S34 - Goo blob cluster", "tag": "section", "dark": false, "js": true, "code": "<style>\n.fx-goo { position: relative; height: 180px; filter: url(#fx-goo-f); }\n.fx-goo i { position: absolute; top: 50%; left: 50%; width: 70px; aspect-ratio: 1; border-radius: 50%;\n  background: var(--accent, #4f46e5); }\n.fx-goo i:nth-child(2) { background: color-mix(in oklch, var(--accent, #4f46e5), var(--accent-2, #06b6d4) 5 ').inert = !open;\n  });\n})();\n<\/script>", "desc": "Two-sided KPI card flipping on button click with honest aria-expanded + inert state management. Click \"How is this measured?\". Crossfades instead of flipping under reduced motion; front face prints.", "meta": "Theming: <code>--accent<\/code>, <code>--surface<\/code>, <code>--track<\/code>, <code>--text<\/code>, <code>--muted<\/code> · Support: 3D transforms universal · Module 10"}, {"id": "s37", "cat": "H - Interactive (wave 2)", "title": "S37 - Cube spinner", "tag": "section", "dark": false, "js": false, "code": "<style>\n.fx-cube-wrap { perspective: 700px; width: max-content; padding: 2rem; }\n.fx-cube { --s: 110px; width: var(--s); aspect-ratio: 1; position: relative; transform-style: preserve-3d;\n  transform: rotateX(-18deg) rotateY(24deg); transition: transform 1.1s cubic-bezier(.3,.7,.3,1); }\n.fx-cube:hover, .fx-cube:focus-visible { transform: rotateX(-18deg) rotateY(204deg); }\n.fx-cube:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 6px; }\n.fx-cube > div { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700;\n  color: var(--bg, #fff); border-radius: 8px;\n  background: color-mix(in oklch, var(--accent, #4f46e5), black calc(var(--f) * 6%)); }\n.fx-cube > div:nth-child(1) { --f: 0; transform: translateZ(calc(var(--s) / 2)); }\n.fx-cube > div:nth-child(2) { --f: 5; transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }\n.fx-cube > div:nth-child(3) { --f: 2; transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }\n.fx-cube > div:nth-child(4) { --f: 3; transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }\n.fx-cube > div:nth-child(5) { --f: 1; transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }\n.fx-cube > div:nth-child(6) { --f: 4; transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }\n@media (prefers-reduced-motion: reduce) { .fx-cube { transition: none; } }\n@media print { .fx-cube { transform: none; } .fx-cube > div:not(:first-child) { display: none; } }\n<\/style>\n<div class=\"fx-cube-wrap\"><div class=\"fx-cube\" tabindex=\"0\" role=\"img\" aria-label=\"Decorative rotating cube\">\n      <div>STA<\/div><div>2026<\/div><div>K-12<\/div><div>Tech<\/div><div>+<\/div><div>=<\/div>\n    <\/div><\/div>", "desc": "A six-face CSS cube built from divs, rotating a half-turn on hover/focus - not continuously, so idle cost is zero. Faces are OKLCH-darkened from one accent for fake lighting. Hover it (or Tab to it).", "meta": "Theming: <code>--accent<\/code> (face color), <code>--s<\/code> (size) · A permanently looping version is DEMO-ONLY per Module 7 idle rules · Support: universal · Module 10"}, {"id": "s38", "cat": "H - Interactive (wave 2)", "title": "S38 - FLIP reorder grid", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-flipgrid .bar { display: flex; gap: .5rem; margin-bottom: .75rem; }\n.fx-flipgrid button { padding: .35rem .8rem; border-radius: 8px; cursor: pointer; font: inherit; font-size: .85rem;\n  border: 1px solid var(--track, #e5e7eb); background: var(--surface, #fff); color: var(--text, #1f2937); }\n.fx-flipgrid button:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n.fx-flipgrid .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }\n.fx-flipgrid .c { padding: .9rem; border-radius: 10px; background: var(--surface, #fff);\n  border: 1px solid var(--track, #e5e7eb); color: var(--text, #1f2937); display: flex; justify-content: space-between; gap: .5rem; }\n.fx-flipgrid .c span { color: var(--accent, #4f46e5); font-weight: 700; font-variant-numeric: tabular-nums; }\n<\/style>\n<div class=\"fx-flipgrid\">\n      <div class=\"bar\"><button data-sort=\"az\">A-Z<\/button><button data-sort=\"val\">By value<\/button><\/div>\n      <div class=\"grid\">\n        <div class=\"c\" data-v=\"42\">Delta<span>42<\/span><\/div><div class=\"c\" data-v=\"91\">Alpha<span>91<\/span><\/div>\n        <div class=\"c\" data-v=\"17\">Echo<span>17<\/span><\/div><div class=\"c\" data-v=\"68\">Bravo<span>68<\/span><\/div>\n        <div class=\"c\" data-v=\"55\">Charlie<span>55<\/span><\/div><div class=\"c\" data-v=\"80\">Foxtrot<span>80<\/span><\/div>\n      <\/div>\n    <\/div>\n<script>\n(() => {\n  const w = document.querySelector('.fx-flipgrid:not([data-init])'); if (!w) return; w.dataset.init = 1;\n  const grid = w.querySelector('.grid');\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)');\n  w.querySelector('.bar').addEventListener('click', e => {\n    const mode = e.target.dataset.sort; if (!mode) return;\n    const first = new Map([...grid.children].map(el => [el, el.getBoundingClientRect()]));\n    [...grid.children]\n      .sort((a, b) => mode === 'val' ? b.dataset.v - a.dataset.v : a.textContent.localeCompare(b.textContent))\n      .forEach(el => grid.appendChild(el));\n    if (reduced.matches) return;\n    for (const el of grid.children) {\n      const f = first.get(el), l = el.getBoundingClientRect();\n      const dx = f.left - l.left, dy = f.top - l.top;\n      if (dx || dy) el.animate(\n        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],\n        { duration: 320, easing: 'cubic-bezier(.2,.7,.3,1)' });\n    }\n  });\n})();\n<\/script>", "desc": "Click A-Z or By value - cards glide to their new positions via the FLIP technique (measure, reorder, invert, animate with WAAPI). Pattern popularized by Paul Lewis. Event-driven, zero idle cost.", "meta": "Theming: <code>--accent<\/code>, <code>--surface<\/code>, <code>--track<\/code>, <code>--text<\/code> · Support: WAAPI universal; reduced motion = instant reorder · Module 14"}, {"id": "s39", "cat": "H - Interactive (wave 2)", "title": "S39 - Springy drag card", "tag": "section", "dark": false, "js": true, "code": "<style>\n.fx-dragzone { height: 200px; display: grid; place-items: center; border-radius: 12px;\n  background: color-mix(in oklch, var(--accent, #4f46e5), var(--bg, #fff) 94%); }\n.fx-dragcard { padding: 1.2rem 1.8rem; border-radius: 12px; cursor: grab; user-select: none;\n  touch-action: none; background: var(--surface, #fff); color: var(--text, #1f2937);\n  border: 1px solid var(--track, #e5e7eb); box-shadow: 0 4px 14px #0002;\n  translate: var(--x, 0px) var(--y, 0px); will-change: translate; }\n.fx-dragcard:active { cursor: grabbing; }\n.fx-dragcard:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 3px; }\n<\/style>\n<div class=\"fx-dragzone\"><div class=\"fx-dragcard\" tabindex=\"0\">Drag me, then let go<\/div><\/div>\n<script>\n(() => {\n  const c = document.querySelector('.fx-dragcard:not([data-init])'); if (!c) return; c.dataset.init = 1;\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let x = 0, y = 0, vx = 0, vy = 0, raf = null, samples = [];\n  const set = () => { c.style.setProperty('--x', x + 'px'); c.style.setProperty('--y', y + 'px'); };\n  c.addEventListener('pointerdown', e => {\n    c.setPointerCapture(e.pointerId); cancelAnimationFrame(raf); samples = [];\n    const sx = e.clientX - x, sy = e.clientY - y;\n    const move = ev => { x = ev.clientX - sx; y = ev.clientY - sy; set();\n      samples.push({ x, y, t: ev.timeStamp }); if (samples.length > 5) samples.shift(); };\n    const up = () => {\n      c.removeEventListener('pointermove', move); c.removeEventListener('pointerup', up);\n      if (reduced || samples.length < 2) { x = y = 0; set(); return; }\n      const a = samples[0], b = samples[samples.length - 1], dt = (b.t - a.t) / 1000 || .016;\n      vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt;\n      let last = performance.now();\n      (function spring(now) {\n        const d = Math.min((now - last) / 1000, 1 / 30); last = now;\n        vx += (-170 * x - 16 * vx) * d; vy += (-170 * y - 16 * vy) * d;\n        x += vx * d; y += vy * d; set();\n        if (Math.hypot(vx, vy) > 2 || Math.hypot(x, y) > .5) raf = requestAnimationFrame(spring);\n        else { x = y = 0; set(); }\n      })(last);\n    };\n    c.addEventListener('pointermove', move); c.addEventListener('pointerup', up);\n  });\n})();\n<\/script>", "desc": "Grab the card, throw it, let go - it springs home carrying your release velocity. Real spring physics in ~20 lines: pointer capture, velocity sampling, stiffness + damping integration. The loop only runs post-release until settled.", "meta": "Theming: <code>--accent<\/code> (zone tint), <code>--surface<\/code>, <code>--track<\/code>, <code>--text<\/code> · Stiffness/damping are the 170/16 constants · Support: Pointer Events universal · Module 14"}, {"id": "s40", "cat": "H - Interactive (wave 2)", "title": "S40 - Squash-and-stretch button", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-squash { padding: .8rem 1.6rem; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;\n  background: var(--accent, #4f46e5); color: var(--bg, #fff);\n  transition: scale .35s ease-out;\n  transition-timing-function: linear(0, 1.18 35%, .94 60%, 1.03 80%, 1);\n  scale: 1; }\n.fx-squash:active { scale: .94 .9; transition-duration: .06s; transition-timing-function: ease-out; }\n.fx-squash:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 3px; }\n.fx-squash:hover { translate: 0 -1px; }\n@media (prefers-reduced-motion: reduce) { .fx-squash { transition: none; } .fx-squash:hover { translate: none; } }\n<\/style>\n<button class=\"fx-squash\">Submit assessment<\/button>", "desc": "Asymmetric tactile press: instant squash on mousedown, springy overshoot release via a linear() spring curve. Press and hold it, then release. Pure CSS, compositor-only - the cheapest game-feel win in the library.", "meta": "Theming: <code>--accent<\/code>, <code>--bg<\/code> · Support: linear() Baseline 2023; older engines get plain ease-out · Module 14 + 8 (S17)"}, {"id": "s41", "cat": "I - Controls", "title": "S41 - Styled range with output bubble", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-range { --p: 60%; display: grid; gap: .4rem; position: relative; max-width: 320px;\n  font-size: .85rem; color: var(--muted, #6b7280); }\n.fx-range input { appearance: none; height: 6px; border-radius: 999px; margin-block: .7rem; cursor: pointer;\n  background: linear-gradient(to right, var(--accent, #4f46e5) var(--p), var(--track, #e5e7eb) 0); }\n.fx-range input::-webkit-slider-thumb { appearance: none; width: 20px; aspect-ratio: 1; border-radius: 50%;\n  background: var(--accent, #4f46e5); border: 3px solid var(--bg, #fff); box-shadow: 0 1px 4px #0003; }\n.fx-range input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;\n  background: var(--accent, #4f46e5); border: 3px solid var(--bg, #fff); box-shadow: 0 1px 4px #0003; }\n.fx-range input:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 4px; }\n.fx-range output { position: absolute; top: -.4rem; left: calc(var(--p) * .92 + 4%); translate: -50% 0;\n  padding: .15rem .5rem; border-radius: 6px; font-size: .75rem; font-variant-numeric: tabular-nums;\n  background: var(--text, #1f2937); color: var(--bg, #fff); opacity: 0; transition: opacity .2s; }\n.fx-range:focus-within output, .fx-range:hover output { opacity: 1; }\n@media (prefers-reduced-motion: reduce) { .fx-range output { transition: none; } }\n<\/style>\n<label class=\"fx-range\">Devices per classroom\n      <input type=\"range\" min=\"0\" max=\"40\" value=\"24\" oninput=\"this.parentNode.style.setProperty('--p', (this.value - this.min) / (this.max - this.min) * 100 + '%'); this.nextElementSibling.value = this.value\">\n      <output>24<\/output>\n    <\/label>", "desc": "Filled-track slider with a value bubble that follows the thumb (hover or focus to see it). Cross-browser via the dual-pseudo thumb pattern; the fill is one gradient driven by a custom property.", "meta": "Theming: <code>--accent<\/code> (fill, thumb), <code>--track<\/code>, <code>--text<\/code>, <code>--bg<\/code> · Support: universal · Module 12"}, {"id": "s42", "cat": "I - Controls", "title": "S42 - Segmented control (radio group)", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-seg { display: inline-flex; padding: 4px; gap: 2px; border: 1px solid var(--track, #e5e7eb);\n  border-radius: 12px; background: color-mix(in oklch, var(--track, #e5e7eb), var(--bg, #fff) 55%); }\n.fx-seg legend { font-size: .72rem; color: var(--muted, #6b7280); padding-inline: .3rem; }\n.fx-seg label { position: relative; cursor: pointer; }\n.fx-seg input { position: absolute; inset: 0; opacity: 0; cursor: inherit; }\n.fx-seg span { display: grid; place-items: center; padding: .45rem 1rem; border-radius: 9px;\n  font-size: .85rem; color: var(--muted, #6b7280); transition: background .18s ease, color .18s ease; }\n.fx-seg label:has(:checked) span { background: var(--surface, #fff); color: var(--text, #1f2937);\n  box-shadow: 0 1px 3px #0002; font-weight: 600; }\n.fx-seg label:has(:focus-visible) span { outline: 2px solid var(--accent, #4f46e5); outline-offset: 1px; }\n@media (prefers-reduced-motion: reduce) { .fx-seg span { transition: none; } }\n@media (forced-colors: active) { .fx-seg label:has(:checked) span { border: 2px solid Highlight; } }\n<\/style>\n<fieldset class=\"fx-seg\"><legend>Report period<\/legend>\n      <label><input type=\"radio\" name=\"fxper\" checked><span>Month<\/span><\/label>\n      <label><input type=\"radio\" name=\"fxper\"><span>Quarter<\/span><\/label>\n      <label><input type=\"radio\" name=\"fxper\"><span>Year<\/span><\/label>\n    <\/fieldset>", "desc": "Real radios styled as a connected pill row - arrow keys, focus, and screen-reader behavior come free because it never stopped being a radio group. <code>:has()<\/code> drives the active fill. Click or arrow-key between options.", "meta": "Theming: <code>--accent<\/code> (focus), <code>--surface<\/code>, <code>--track<\/code>, <code>--text<\/code>, <code>--muted<\/code> · Never rebuild this with divs necap=\"round\"/><\/svg>\n      <\/div>\n      <div class=\"errwrap\"><small>Enter a valid email address.<\/small><\/div>\n    <\/div>", "desc": "Type something invalid and Tab away: border flips, error slides open, field shakes once. Type a valid email: a check draws itself in. All driven by <code>:user-invalid<\/code>/<code>:user-valid<\/code> - no validation JS at all.", "meta": "Theming: <code>--accent<\/code>, <code>--danger<\/code>, <code>--ok<\/code>, <code>--surface<\/code>, <code>--track<\/code> · Color never carries state alone · Support: :user-invalid Baseline 2023 · Module 12 + 9"}, {"id": "s44", "cat": "J - Theming", "title": "S44 - Theme-swap control with view-transition reveal", "tag": "section", "dark": false, "js": true, "code": "<style>\n:root { color-scheme: light dark; }\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n.fx-theme { width: 2.4rem; aspect-ratio: 1; border-radius: 50%; cursor: pointer; font-size: 1.1rem;\n  border: 1px solid var(--track, #e5e7eb); background: var(--surface, #fff); color: var(--text, #1f2937); }\n.fx-theme:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }\n<\/style>\n<button class=\"fx-theme\" aria-pressed=\"false\" title=\"Toggle dark mode\">&#9681;<\/button>\n<script>\n(() => {\n  const b = document.querySelector('.fx-theme:not([data-init])'); if (!b) return; b.dataset.init = 1;\n  const root = document.documentElement;\n  const saved = localStorage.getItem('fx-theme');\n  if (saved) { root.dataset.theme = saved; b.setAttribute('aria-pressed', String(saved === 'dark')); }\n  b.addEventListener('click', e => {\n    const dark = matchMedia('(prefers-color-scheme: dark)').matches;\n    const cur = root.dataset.theme || (dark ? 'dark' : 'light');\n    const next = cur === 'dark' ? 'light' : 'dark';\n    const apply = () => { root.dataset.theme = next; localStorage.setItem('fx-theme', next);\n      b.setAttribute('aria-pressed', String(next === 'dark')); };\n    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return apply();\n    const t = document.startViewTransition(apply);\n    t.ready.then(() => {\n      const r = Math.hypot(Math.max(e.clientX, innerWidth - e.clientX), Math.max(e.clientY, innerHeight - e.clientY));\n      root.animate(\n        { clipPath: [`circle(0 at ${e.clientX}px ${e.clientY}px)`, `circle(${r}px at ${e.clientX}px ${e.clientY}px)`] },\n        { duration: 450, easing: 'ease-in', pseudoElement: '::view-transition-new(root)' });\n    });\n  });\n})();\n<\/script>", "desc": "Light/dark toggle that persists to localStorage and reveals the new theme as an expanding circle from the click point (View Transitions). Click it - in this gallery only native controls and form fields respond, because the gallery's own palette is fixed; in a real report every light-dark() token flips.", "meta": "Theming: flips the axis for any light-dark() token set (Module 16 contract) · SECTION-PIECE: owns a root attribute + the root transition · Support: view transitions Baseline Newly Available; instant swap elsewhere · Module 16"}, {"id": "s45", "cat": "J - Theming", "title": "S45 - OKLCH ramp generator block", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n.fx-ramp {\n  --brand-50:  oklch(from var(--brand, #4f46e5) 97% calc(c * .25) h);\n  --brand-100: oklch(from var(--brand, #4f46e5) 93% calc(c * .45) h);\n  --brand-300: oklch(from var(--brand, #4f46e5) 80% calc(c * .8) h);\n  --brand-500: oklch(from var(--brand, #4f46e5) 62% c h);\n  --brand-700: oklch(from var(--brand, #4f46e5) 48% c h);\n  --brand-900: oklch(from var(--brand, #4f46e5) 32% calc(c * .7) h);\n  --brand-companion: oklch(from var(--brand, #4f46e5) l c calc(h + 40));\n  --brand-hover:  color-mix(in oklch, var(--brand-500), white 12%);\n  --brand-active: color-mix(in oklch, var(--brand-500), black 14%);\n  --brand-wash:   color-mix(in oklch, var(--brand-500), transparent 92%);\n  display: flex; height: 44px; border-radius: 10px; overflow: hidden; }\n.fx-ramp i { flex: 1; }\n.fx-ramp i:nth-child(1) { background: var(--brand-50); }\n.fx-ramp i:nth-child(2) { background: var(--brand-100); }\n.fx-ramp i:nth-child(3) { background: var(--brand-300); }\n.fx-ramp i:nth-child(4) { background: var(--brand-500); }\n.fx-ramp i:nth-child(5) { background: var(--brand-700); }\n.fx-ramp i:nth-child(6) { background: var(--brand-900); }\n@media (forced-colors: active) { .fx-ramp { forced-color-adjust: none; } }\n<\/style>\n<div class=\"fx-ramp\" style=\"--brand: #1d4ed8\">\n      <i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i>\n    <\/div>\n    <p class=\"pg-note\" style=\"margin:.75rem 0 0;\">This strip uses STA blue (#1d4ed8) as input - edit <code>--brand<\/code> inline to re-derive everything.<\/p>", "desc": "One <code>--brand<\/code> input derives a six-step lightness ramp, hover/active states, and a wash - via relative color syntax. The swatch strip IS the unit test. Move the token block to :root and it becomes the page's color system.", "meta": "Theming: <code>--brand<\/code> is the single input · Support: relative color syntax + color-mix, Baseline 2024 · Module 16"}, {"id": "s46", "cat": "J - Theming", "title": "S46 - Animated gradient border card", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n@property --fx-ga { syntax: \"<angle>\"; inherits: false; initial-value: 35deg; }\n.fx-gborder { padding: 1.2rem 1.4rem; border: 2px solid transparent; border-radius: 14px;\n  color: var(--text, #1f2937);\n  background: linear-gradient(var(--surface, #fff), var(--surface, #fff)) padding-box,\n    conic-gradient(from var(--fx-ga), var(--accent, #4f46e5), var(--accent-2, #06b6d4), var(--accent, #4f46e5)) border-box; }\n.fx-gborder h3 { margin-top: 0; }\n@media (prefers-reduced-motion: no-preference) {\n  .fx-gborder:hover { animation: fx-ga-spin 2.4s linear infinite; }\n}\n@keyframes fx-ga-spin { to { --fx-ga: 395deg; } }\n@media (forced-colors: active) { .fx-gborder { border-color: ButtonText; background: Canvas; } }\n@media print { .fx-gborder { animation: none !important; } }\n<\/style>\n<div class=\"fx-gborder\" style=\"max-width:380px;\"><h3>Featured finding<\/h3><p style=\"margin-bottom:0;\">Help Center deflection rose 18% after the search revamp.<\/p><\/div>", "desc": "A conic gradient ring orbits the card border on hover via a registered angle property. Hover it. Hover-gated = zero idle cost; a permanently spinning version demotes to SECTION-PIECE.", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code>, <code>--surface<\/code>, <code>--text<\/code> · Support: @property Baseline 2024; static gradient border elsewhere · Module 15"}, {"id": "s47", "cat": "K - Reactive", "title": "S47 - Audio-bar visualizer with gesture gate", "tag": "section", "dark": false, "js": true, "code": "<style>\n.fx-audiobars { display: grid; gap: .6rem; }\n.fx-audiobtn { justify-self: start; padding: .55rem 1.1rem; border: none; border-radius: 10px; cursor: pointer;\n  font: inherit; font-weight: 600; background: var(--accent, #4f46e5); color: #fff; }\n.fx-audiobars canvas { width: 100%; height: 80px; border-radius: 10px;\n  background: color-mix(in oklch, var(--accent, #4f46e5), var(--bg, #fff) 94%); }\n<\/style>\n<div class=\"fx-audiobars\">\n      <button class=\"fx-audiobtn\">▶ Play 5s test tone<\/button>\n      <canvas height=\"80\" aria-hidden=\"true\"><\/canvas>\n    <\/div>\n<script>\n(() => {\n  const w = document.querySelector('.fx-audiobars:not([data-init])'); if (!w) return; w.dataset.init = 1;\n  const btn = w.querySelector('.fx-audiobtn'), cv = w.querySelector('canvas'), ctx2 = cv.getContext('2d');\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let actx, an, bins, raf = null, playing = false;\n  const accent = () => (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#4f46e5').trim();\n  function draw() {\n    cv.width = cv.clientWidth * devicePixelRatio; cv.height = 80 * devicePixelRatio;\n    ctx2.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);\n    an.getByteFrequencyData(bins);\n    const n = 32, bw = cv.clientWidth / n;\n    ctx2.clearRect(0, 0, cv.clientWidth, 80); ctx2.fillStyle = accent();\n    for (let i = 0; i < n; i++) {\n      const v = bins[Math.floor(i * bins.length / n)] / 255;\n      const h = Math.max(3, v * 72);\n      ctx2.beginPath(); ctx2.roundRect(i * bw + 2, 80 - h - 4, bw - 4, h, 3); ctx2.fill();\n    }\n    if (playing) raf = requestAnimationFrame(draw);\n  }\n  btn.addEventListener('click', () => {\n    if (playing) return;\n    actx = actx || new AudioContext();\n    an = an || actx.createAnalyser(); an.fftSize = 128; an.smoothingTimeConstant = .78;\n    bins = new Uint8Array(an.frequencyBinCount);\n    const g = actx.createGain(); g.gain.value = .12;\n    const lfo = actx.createOscillator(), lg = actx.createGain();\n    lfo.frequency.value = .8; lg.gain.value = .08; lfo.connect(lg); lg.connect(g.gain);\n    [196, 247, 294, 392].forEach(f => {\n      const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;\n      o.connect(g); o.start(); o.stop(actx.currentTime + 5);\n    });\n    g.connect(an); an.connect(actx.destination); lfo.start(); lfo.stop(actx.currentTime + 5);\n    playing = true; btn.textContent = '♪ playing...';\n    if (reduced) { setTimeout(() => an.getByteFrequencyData(bins), 300); setTimeout(draw, 350); }\n    else { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }\n    setTimeout(() => { playing = false; btn.textContent = '▶ Play 5s test tone'; cancelAnimationFrame(raf); }, 5100);\n  });\n  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf);\n    else if (playing && !reduced) raf = requestAnimationFrame(draw); });\n})();\n<\/script>", "desc": "Canvas bar spectrum fed by an AnalyserNode. The module snippet wires it to an <code>&lt;audio&gt;<\/code> element (the play button IS the autoplay-policy gesture gate); this gallery demo synthesizes a 5-second test tone instead so it works without an audio file. Click play.", "meta": "Theming: <code>--accent<\/code> (bars), <code>--bg<\/code> (canvas wash) · Loop runs only while playing; pauses on tab hide · Support: Web Audio universal · Module 17"}, {"id": "s48", "cat": "K - Reactive", "title": "S48 - Tilt/pointer parallax card", "tag": "dropin", "dark": false, "js": true, "code": "<style>\n.fx-tiltcard { position: relative; width: 260px; height: 160px; border-radius: 14px; overflow: hidden;\n  background: var(--surface, #fff); border: 1px solid var(--track, #e5e7eb); display: grid; place-items: center; }\n.fx-tiltcard:focus-visible { outline: 2px solid var(--accent, #4f46e5); outline-offset: 2px; }\n.fx-tiltcard .bg { position: absolute; inset: -14%; border-radius: inherit;\n  background: radial-gradient(circle at 30% 30%, color-mix(in oklch, var(--accent, #4f46e5), transparent 75%), transparent 60%),\n              radial-gradient(circle at 75% 75%, color-mix(in oklch, var(--accent-2, #06b6d4), transparent 80%), transparent 55%);\n  translate: calc(var(--rx, 0) * -8px) calc(var(--ry, 0) * -8px); }\n.fx-tiltcard .fg { position: relative; text-align: center; color: var(--text, #1f2937);\n  translate: calc(var(--rx, 0) * 6px) calc(var(--ry, 0) * 6px); }\n.fx-tiltcard .fg b { display: block; font-size: 1.4rem; color: var(--accent, #4f46e5); }\n.fx-tiltcard .fg span { font-size: .8rem; color: var(--muted, #6b7280); }\n@media (prefers-reduced-motion: no-preference) {\n  .fx-tiltcard .bg, .fx-tiltcard .fg { transition: translate .2s ease-out; } }\n<\/style>\n<div class=\"fx-tiltcard\" tabindex=\"0\">\n      <div class=\"bg\" aria-hidden=\"true\"><\/div>\n      <div class=\"fg\"><b>14 schools<\/b><span>migrated this summer<\/span><\/div>\n    <\/div>\n<script>\n(() => {\n  const p = document.querySelector('.fx-tiltcard:not([data-init])'); if (!p) return; p.dataset.init = 1;\n  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  const set = (rx, ry) => { p.style.setProperty('--rx', Math.max(-1, Math.min(1, rx)));\n    p.style.setProperty('--ry', Math.max(-1, Math.min(1, ry))); };\n  p.addEventListener('pointermove', e => {\n    const r = p.getBoundingClientRect();\n    set(((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2);\n  });\n  p.addEventListener('pointerleave', () => set(0, 0));\n  if (matchMedia('(pointer: coarse)').matches) p.addEventListener('click', async () => {\n    try {\n      if (typeof DeviceOrientationEvent?.requestPermission === 'function' &&\n          await DeviceOrientationEvent.requestPermission() !== 'granted') return;\n      addEventListener('deviceorientation', ev => set((ev.gamma || 0) / 30, (ev.beta || 0) / 45));\n    } catch {}\n  }, { once: true });\n})();\n<\/script>", "desc": "Layered parallax driven by pointer on desktop and (after a tap-to-enable gesture) device tilt on mobile - background and foreground translate opposite directions. Move your cursor across it. Note: renamed to <code>.fx-tiltcard<\/code> in this gallery (the module's <code>.fx-parallax<\/code> collides with S12's demo class).", "meta": "Theming: <code>--accent<\/code>, <code>--accent-2<\/code>, <code>--surface<\/code>, <code>--track<\/code>, <code>--text<\/code>, <code>--muted<\/code> · Event-driven; tilt fails closed to pointer/static · Support: Pointer Events universal · Module 17 + 4"}, {"id": "s49", "cat": "I - Cards (Wave 2)", "title": "S49 - Glassmorphism card done well", "tag": "dropin", "dark": true, "js": false, "code": "<style>\n.fx-glass {\n  --tint: 255 255 255; /* light tint; use 12 16 34 for dark glass */\n  position: relative; max-width: 340px; padding: 1.5rem 1.6rem; border-radius: 18px;\n  color: var(--text, #10142a); isolation: isolate;\n  background: rgb(var(--tint) / .28);\n  backdrop-filter: blur(14px) saturate(160%);\n  -webkit-backdrop-filter: blur(14px) saturate(160%);\n  box-shadow: 0 8px 32px rgb(8 10 30 / .22), inset 0 1px 0 rgb(255 255 255 / .45);\n  border: 1px solid rgb(255 255 255 / .35);\n}\n/* bottom-right shadow edge, masked so only that corner darkens */\n.fx-glass::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;\n  border: 1px solid rgb(8 10 30 / .18);\n  -webkit-mask: linear-gradient(135deg, transparent 55%, #000 100%);\n          mask: linear-gradient(135deg, transparent 55%, #000 100%);\n}\n@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {\n  .fx-glass { background: rgb(var(--tint) / .82); } /* opaque fallback, still legible */\n}\n<\/style>\n<article class=\"fx-glass\">\n  <h3>Quarterly Snapshot<\/h3>\n  <p>Resolved tickets are up 18% over last quarter, with median time-to-close down to 4.2 hours.<\/p>\n<\/article>", "desc": "Most glass cards fail because they float on a flat background (nothing to refract) and skip the edge light. This one layers a `backdrop-filter` blur+saturate, a dual border (a hairline highlight on top-left, shadow on bottom-right via a masked pseudo), and a soft inner top-edge highlight to fake a light source. Put it over a photo or a mesh gradient, never over flat white. Differs from anything in Wave 1: there was no glass card.", "meta": ""}, {"id": "s50", "cat": "I - Cards (Wave 2)", "title": "S50 - Border-beam traveling-light card", "tag": "dropin", "dark": false, "js": false, "code": "<style>\n@property --fx-beam { syntax: \"<angle>\"; inherits: false; initial-value: 0deg; }\n.fx-beam {\n  --bw: 2px; position: relative; max-width: 320px; padding: 1.4rem 1.5rem; border-radius: 16px;\n  background: var(--bg, #0f1226); color: var(--text, #e7e9f5);\n}\n.fx-beam::before {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit; padding: var(--bw); pointer-events: none;\n  background:\n    conic-gradient(from var(--fx-beam),\n      transparent 0 78%,\n      var(--accent, #38bdf8) 88%,\n      color-mix(in oklch, var(--accent, #38bdf8), white 35%) 92%,\n      transparent 96% 100%),\n    linear-gradient(var(--track, #2a2f55), var(--track, #2a2f55)); /* static rail under the beam */\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor; mask-composite: exclude;\n}\n@media (prefers-reduced-motion: no-preference) {\n  .fx-beam::before { animation: fx-beam-run 3.2s linear infinite; }\n}\n@keyframes fx-beam-run { to { --fx-beam: 360deg; } }\n<\/style>\n<article class=\"fx-beam\">\n  <h3>Live Sync<\/h3>\n  <p>Connected. Streaming changes in real time.<\/p>\n<\/article>", "desc": "A single bead of light travels the perimeter, not a full rotating conic ring. The trick is a conic gradient with one bright arc, animated through a registered `--fx-beam` angle, masked to only the border thickness with two stacked masks (`padding-box` minus `content-box`). Differs from S46 (whole-border gradient rotates): here the border is a static base color and only a short comet runs around it.", "meta": ""}, {"id": "s51", "cat": "I - Cards (Wave 2)", "title": "S51 - Shared-spotlight card grid", "tag": "section", "dark": false, "js": true, "code": "<style>\n.fx-slgrid {\n  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px;\n  background: var(--track, #20243f); border-radius: 16px; padding: 1px;\n}\n.fx-slgrid .card {\n  position: relative; padding: 1.4rem 1.5rem; background: var(--bg, #11142b); color: var(--text, #e7e9f5);\n  overflow: hidden;\n}\n.fx-slgrid .card:first-child { border-radius: 15px 15px 0 0; }\n.fx-slgrid .card:last-child  { border-radius: 0 0 15px 15px; }\n/* radial glow positioned from shared pointer vars, in the card's own coordinate space */\n.fx-slgrid .card::before {\n  conte
