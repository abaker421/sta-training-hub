# CodeRabbit config - STA Training Kit Hub
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
reviews:
  profile: chill              # switch to "assertive" if reviews feel too soft
  high_level_summary: true
  poem: false                 # skip the novelty poem in review summaries
  path_filters:
    - "!dist/**"              # generated mirror - regenerated from source, never review
chat:
  auto_reply: true
